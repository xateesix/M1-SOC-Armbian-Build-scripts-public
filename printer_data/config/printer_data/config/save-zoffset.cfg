########################################################################
# Save Z-Offset - from https://github.com/Guilouz/Creality-Helper-Script
########################################################################
# STATE: Dormant. printer.cfg does not include this file.
# WHAT:  Saves the Z offset to variables.cfg whenever SET_GCODE_OFFSET is used and
#        applies it again 2 s after every Klipper start.
# WHY:   Klipper forgets a Z offset set with SET_GCODE_OFFSET when it restarts.
# DEPENDS: variables.cfg, the data file behind [save_variables]. Klipper rewrites
#        it on every save and drops comments, so it must stay comment-free.
#        It also holds keys (autolevel, shapper, retract_value_filament_N) left over
#        from the removed slicer-macro.cfg.
# TODO(verify): how the Z offset persists today without this file (BDsensor or
#        SAVE_CONFIG).
[save_variables]
filename: ~/printer_data/config/variables.cfg

[respond]


# WHAT: Wraps Klipper's SET_GCODE_OFFSET (renamed _SET_GCODE_OFFSET). Applies the
#       change, then stores the resulting Z in variables.cfg. Handles Z and Z_ADJUST.
# WHEN: Baby-stepping from the web UI or the console.
[gcode_macro SET_GCODE_OFFSET]
description: Saving Z-Offset
rename_existing: _SET_GCODE_OFFSET
gcode:
    RESPOND PREFIX=info MSG="📌 Macro executed : SET_GCODE_OFFSET {params}"
  {% if printer.save_variables.variables.zoffset %}
    {% set zoffset = printer.save_variables.variables.zoffset %}
  {% else %}
    {% set zoffset = {'z': None} %}
  {% endif %}
  {% set ns = namespace(zoffset={'z': zoffset.z}) %}
  _SET_GCODE_OFFSET {% for p in params %}{'%s=%s '% (p, params[p])}{% endfor %}
  {%if 'Z' in params %}
    {% set null = ns.zoffset.update({'z': params.Z}) %}
  {% endif %}
  {%if 'Z_ADJUST' in params %}
    {%if ns.zoffset.z == None %}
      {% set null = ns.zoffset.update({'z': 0}) %}
    {% endif %}
    {% set null = ns.zoffset.update({'z': (ns.zoffset.z | float) + (params.Z_ADJUST | float)}) %}
  {% endif %}
  SAVE_VARIABLE VARIABLE=zoffset VALUE="{ns.zoffset}"


# WHAT: Reads the saved Z offset from variables.cfg and applies it 2 s after start.
# NOTE: The commented G28, M400 and G1 lines are kept from upstream and are not run.
[delayed_gcode LOAD_GCODE_OFFSETS]
initial_duration: 2
gcode:
    RESPOND PREFIX=info MSG="📌 Macro executed : LOAD_GCODE_OFFSETS {params}"
   # G28
   # M400
   # G0
   # M400
  {% if printer.save_variables.variables.zoffset %}
    {% set zoffset = printer.save_variables.variables.zoffset %}
    _SET_GCODE_OFFSET {% for axis, offset in zoffset.items() if zoffset[axis] %}{ "%s=%s " % (axis, offset) }{% endfor %}
    RESPOND TYPE=command MSG="Loaded Z-Offset from variables.cfg: {zoffset.z}mm"
   # G1 Z10
  
  {% endif %}
  