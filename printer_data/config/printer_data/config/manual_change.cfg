# ===================================================================
# Manual Tool Selection & Filament Alignment Triggers
# ===================================================================

# STATE: Dormant. Commented out in printer.cfg.
# WHAT:  T0-T7 pause the print and ask for filament N to be inserted by hand.
#        MANUAL_FILAMENT_CHANGE pauses, heats, forms a tip with _FORM_TIP, backs the
#        filament out 50 mm and asks you to load the new roll and click Resume.
# WHEN:  Called by the slicer on a colour change, or by hand.
# DEPENDS: PAUSE and RESUME in print-macros.cfg (PAUSE reads R and RETRACT),
#        _FORM_TIP in filament-macros.cfg.
# WARNING: ams.cfg also defines T0-T3. Never load both, and the same goes for a
#        future ACE config.
[gcode_macro T0]
variable_retract: 2
variable_nozzle_temp: 250
gcode:
    RESPOND PREFIX=info MSG="📌 Tool Change: Insert Filament N°1"
    PAUSE R={nozzle_temp} RETRACT={retract}

[gcode_macro T1]
variable_retract: 2
