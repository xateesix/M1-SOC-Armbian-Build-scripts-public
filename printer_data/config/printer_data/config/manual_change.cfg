[gcode_macro MANUAL_FILAMENT_CHANGE]
gcode:
    {% set tool = params.TOOL|default(1)|int %}
    {% set target_temp = params.TEMP|default(250)|int %}

    RESPOND PREFIX=info MSG="📌 Tool Change: Insert Filament N°{tool}"
    
    # 1. Standard Klipper pause to park the toolhead safely
    PAUSE

    # 2. Set/Maintain the required nozzle temperature for the swap
    M104 S{target_temp}
    M109 S{target_temp}

    # 3. Call the single standalone ramming routine
    _FORM_TIP

    # 4. Clear the Extruder Gears 
    G91
    G1 E-50 F300   
    G90
    M400
    
    RESPOND PREFIX=info MSG="📥 Filament N°{tool} ready to pull. Load the new roll and click Resume."
