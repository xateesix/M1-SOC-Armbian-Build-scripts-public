[gcode_macro T0]
variable_retract: 2
variable_nozzle_temp: 250
gcode:
    RESPOND PREFIX=info MSG="📌 Tool Change: Insert Filament N°1"
    PAUSE R={nozzle_temp} RETRACT={retract}

