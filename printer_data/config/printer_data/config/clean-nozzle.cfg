# ===================================================================
# Mainline Klipper Adaptive Nozzle Cleaning & Post-Processing Pipeline
# ===================================================================

[gcode_macro _MOVE_TO_COLLECTION_BOX]
description: Safely navigates the toolhead through the secure rear Y-corridor to the waste box
gcode:
    G90 ; Absolute positioning
    M400
    # Plunge deep into the safe center Y corridor to clear frame corners
    G1 X200 Y260 F21000
    # Move back to the rear wall line
    G1 X200 Y275 F6000
    G1 X160 Y275 F6000
    # Dock squarely over the purge bucket
    G1 X137 Y275 F3000
    M400

[gcode_macro CLEAN_NOZZLE]
description: Dynamic multi-stage material purge, soft-state brush scrub, and flat PEI tip-molding cycle
gcode:
    RESPOND TYPE=echo MSG="🔍 Initializing Intelligent Nozzle Cleaning Pipeline..."
    SAVE_GCODE_STATE NAME=clean_nozzle_state
    
    # 1. Fetch live profile tracking variables from your active material matrix
    {% set liquid_purge = printer["gcode_macro _FILAMENT_TYPE"].purge_temp|int %}
    {% set soft_wipe = printer["gcode_macro _FILAMENT_TYPE"].wipe_temp|int %}
    {% set original_target = printer.extruder.target|int %}
    
    # Fallback safety default guards if called manually while idling
    {% if liquid_purge == 0 %} {% set liquid_purge = 220 %} {% endif %}
    {% if soft_wipe == 0 %} {% set soft_wipe = 150 %} {% endif %}
    
    # ==========================================
    # PHASE 1: HIGH-TEMP LIQUID PURGE SQUEEZE
    # ==========================================
    SET_DISPLAY_TEXT MSG="Hotend Purging: {liquid_purge}C"
    RESPOND TYPE=echo MSG="🔥 Heating toolhead to active flow zone: {liquid_purge}C"
    M104 S{liquid_purge}
    M109 S{liquid_purge}

    # Execute safe corridor movement into the material collection area
    _MOVE_TO_COLLECTION_BOX

    RESPOND TYPE=echo MSG="♺ Flushing nozzle melt zone..."
    M106 S0                        ; Turn off part fan so hot plastic drops vertically without curling
    M83                            ; Relative extrusion mode
    G1 E40 F300                    ; Extrude 40mm to push out historical filament traces
    G1 E40 F250                    ; Secondary slow squeeze to clear the melt pocket
    G1 E-2 F600                    ; Soft snap retraction to break the raw ooze string
    M400

    # ==========================================
    # PHASE 2: CRITICAL COOLDOWN TO MALLEABLE STATE
    # ==========================================
    SET_DISPLAY_TEXT MSG="Cooling for brush: {soft_wipe}C"
    RESPOND TYPE=echo MSG="❄️ Turning on all cooling fans to hit soft-wipe target: {soft_wipe}C"
    
    # Force max air velocity using your mainline dual part-cooling fan configurations
    M106 S255                                   
    {% if printer["fan_generic secondary_cooling_fan"] is defined %} SET_FAN_SPEED FAN=secondary_cooling_fan SPEED=1.0 {% endif %}
    {% if printer["fan_generic _Secondary_Fan"] is defined %} SET_FAN_SPEED FAN=_Secondary_Fan SPEED=1.0 {% endif %}
    {% if printer["fan_generic secondary_part_fan"] is defined %} SET_FAN_SPEED FAN=secondary_part_fan SPEED=1.0 {% endif %}
    
    # Hover safely above the scrub corridor while dropping temperature
    G90
    G1 X153 Y269.5 Z5 F6000
    
    # Wait for the hotend to drop into the custom material glass-transition zone
    M104 S{soft_wipe}
    M109 S{soft_wipe}

    # ==========================================
    # PHASE 3: THE SOFT SILICONE BRUSH SCRUB PASS
    # ==========================================
    SET_DISPLAY_TEXT MSG="Scrubbing Nozzle Tip..."
    RESPOND TYPE=command MSG="扫 🧹 Peeling off residual envelope across silicone teeth..."
    
    # Plunge into the brush at your mechanical Z height clearance
    G1 Z0.5 F1500
    
    # Execute mechanical side-to-side scrub pattern across the brush boundary
    G1 X186 Y269.5 Z0.5 F3000
    G1 X153 Y269 Z0.5 F3000
    G1 X186 Y269 Z0.5 F3000
    G1 X153 Y268.5 Z0.5 F3000
    G1 X186 Y268.5 Z0.5 F3000
    M400
    
    G1 Z3 F3000                    ; Clear brush teeth

    # ==========================================
    # PHASE 4: MECHANICAL PEI TIP MOLD / NOZZLE SEAL
    # ==========================================
    SET_DISPLAY_TEXT MSG="Molding Nozzle Tip..."
    RESPOND TYPE=echo MSG="🔒 Docking over PEI seal plate to flat-mold nozzle tip..."
    
    # Move to your dedicated sealing location
    G1 X193 Y269 Z2 F6000
    M400
    
    # Compression pass: drive nozzle flat down into the seal plate at a negative offset
    G1 X193 Y269 Z1 F1000
    G1 X200 Y269 Z0 F80
    G1 X205 Y269 Z0 F80
    M400
    G1 X205 Y269 Z-0.2 F60         ; Apply mechanical compression sealing pressure
    
    # Command cool down to standalone storage state while under compression
    M104 S140
    M109 S140
    M400
    
    # Safe break away from the molding seal plate
    G1 X215 Y269 Z1 F600
    G1 Z10 F3000                   ; Lift to clear
    M400
    
    # ==========================================
    # PHASE 5: AIRVELOCITY RESET & TEMPERATURE RESTORE
    # ==========================================
    # Kill the extra cooling fan arrays now that the process is over
    M106 S0                                     
    {% if printer["fan_generic secondary_cooling_fan"] is defined %} SET_FAN_SPEED FAN=secondary_cooling_fan SPEED=0 {% endif %}
    {% if printer["fan_generic _Secondary_Fan"] is defined %} SET_FAN_SPEED FAN=_Secondary_Fan SPEED=0 {% endif %}
    {% if printer["fan_generic secondary_part_fan"] is defined %} SET_FAN_SPEED FAN=secondary_part_fan SPEED=0 {% endif %}

    # Restore the printer back to whatever temperature it was executing prior to the clean call
    {% if original_target > 0 %}
        RESPOND TYPE=echo MSG="✨ Restoring hotend target temperature to: {original_target}C"
        M104 S{original_target}
    {% else %}
        M104 S0
    {% endif %}

    RESPOND TYPE=echo MSG="✨ Intelligent cleaning cycle complete. Ready for next sequence."
    RESTORE_GCODE_STATE NAME=clean_nozzle_state
