[gcode_macro CLEAN_NOZZLE]
description: Safely navigates the Y corridor to purge at flow temp, then cools to soft-state for a clean silicone wipe.
variable_homing_z_active: 0
gcode:
    # --- 1. DETECT AND STORE ORIGINAL TEMPERATURES & CONFIG STATES ---
    {% set original_target = printer.extruder.target|int %}
    SAVE_GCODE_STATE NAME=clean_nozzle_state
    
    # Fetch profile tracking variables dynamically from our active material matrix
    {% set liquid_purge = printer["gcode_macro _FILAMENT_TYPE"].purge_temp|int %}
    {% set soft_wipe = printer["gcode_macro _FILAMENT_TYPE"].wipe_temp|int %}
    
    # Fallback paths if no print file is actively running yet
    {% if liquid_purge == 0 %} {% set liquid_purge = params.TARGET_TEMP|default(original_target if original_target > 140 else 220)|int %} {% endif %}
    {% if soft_wipe == 0 %} {% set soft_wipe = 150 %} {% endif %}
    
    {% set purge_speed = 210 | float %} 
    G90                                   

    # --- 2. TRANSIT & HEAT TO LIQUID MELT PURGE ---
    SET_DISPLAY_TEXT MSG="Hotend Purging: {liquid_purge}C"
    RESPOND TYPE=echo MSG="🔥 Heating toolhead to liquid melt zone: {liquid_purge}C"
    M104 S{liquid_purge}
    M109 S{liquid_purge}

    # Execute your native verified safety pathing into the Y corridor
    G1 X137 Y260 F3000
    G1 X200 Y260 F3000
    G1 X200 Y275 F3000
    G1 X160 Y275 F3000
    G1 X137 Y275 F3000
    M400

    # --- 3. LIQUID PURGE SQUEEZE ---
    RESPOND TYPE=echo MSG="♺ Flushing nozzle melt zone..."
    M83                                         
    G1 E40 F{purge_speed}                       
    G1 E-2 F{purge_speed}                       ; Snap retraction to minimize stringing
    M400

    # --- 4. COOL DOWN TO MALLEABLE SOFT-WIPE STATE ---
    SET_DISPLAY_TEXT MSG="Cooling for brush: {soft_wipe}C"
    RESPOND TYPE=echo MSG="❄️ Crisp cooling nozzle down to soft-wipe target: {soft_wipe}C"
    
    M106 S255                                   ; Part fan to max to break the heat loop quickly
    
    # Hover safely above the scrub zone while cooling down to shield the brush tabs
    G1 X153 Y269.5 Z5 F3000
    
    # Stall the queue until the nozzle hits the glass transition zone
    M104 S{soft_wipe}
    M109 S{soft_wipe}

    # --- 5. ACTIVE SOFT SILICONE SCRUB ---
    SET_DISPLAY_TEXT MSG="Scrubbing Nozzle Tip..."
    RESPOND TYPE=command MSG="🧹 Commencing soft-state plastic scrub across silicone teeth..."
    
    # Plunge into the brush at your original verified wipe Z height
    G1 Z0.5 F1500
    
    # Run your active corridor scrub pathing
    G1 X186 Y269.5 Z0.5 F3000
    G1 X153 Y269 Z0.5 F3000
    G1 X186 Y269 Z0.5 F3000
    M400
    
    # Lift toolhead and turn off air velocity
    G1 Z5 F3000                                 
    M106 S0                                     

    # --- 6. SAFE EXIT CORRIDOR ROUTE ---
    G1 X137 Y269 F3000
    G1 Y250 F3000

    # --- 7. RESTORE PREVIOUS TEMPERATURE & FRAMEWORK STATE ---
    {% if original_target > 0 %}
        RESPOND TYPE=echo MSG="✨ Restoration cycle active. Returning hotend to: {original_target}C"
        M104 S{original_target}                 
    {% else %}
        M104 S0
    {% endif %}

    RESTORE_GCODE_STATE NAME=clean_nozzle_state
