# ===================================================================
# Toolhead MCU (THR) - GD32F303 board, filament runout, cutter sensors, case light
# ===================================================================
# Copyright (c) 2026 XateEsix. Original work.
# SPDX-License-Identifier: GPL-3.0-only
# WHAT: Declares the toolhead MCU, the filament runout sensor with its monitor loop,
#       two passive cutter sensors and the case light output.
# WHY:  The toolhead board reports filament and cutter state as analog voltages.
#       Klipper has no native filament ADC, so the voltages are read through
#       fake "temperature" sensors and checked by the macros below.
# DEPENDS: print-macros.cfg: its RESUME re-arms the runout monitor and its M600
#       triggers the pause. The LIS2DW accelerometer on THR:PA4 is configured in
#       printer.cfg, not here.
#
# the chip is an stm32f103xe clone gd32f303RET6 chip with PB10 PB9 PB8 PC15 PA0 PA12 PC13 PB10 already mapped along with the standard usb pins
[mcu THR]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_10643B879894B00439333931-if00
restart_method: command

# --- DETECTOR HARDWARE INPUTS ---

# Voltage-to-number table: the reading is about 100 * volts / 3.3 up to 151 at 5 V.
[adc_temperature hall_voltage_map]
temperature1: 0
voltage1: 0.0
temperature2: 100
voltage2: 3.3
temperature3: 151
voltage3: 5.0

# Filament presence sensor on THR:PB1. Read by _FILAMENT_MONITOR. Measured by the
# owner: about 2.6 with filament loaded, about 28 when empty.
[temperature_sensor filament_adc1]
sensor_type: hall_voltage_map
sensor_pin: THR:PB1
min_temp: -100
max_temp: 300

# --- AUTOMATED MACROS & RUNOUT LOOP ---

# WHAT: Counts a strike for every check where filament_adc1 reads above
#       adc1_runout_threshold. A good reading clears the strikes. After
#       max_allowed_strikes in a row it switches itself off, clears the strikes
#       and calls PAUSE.
# WHEN: Called every second by _RUNOUT_TICKER, always, not only while printing.
# NOTE: RESUME in print-macros.cfg switches it back on. M118 prints one console line
#       per strike, only while the reading is high.
# WARNING: While idle, a confirmed "runout" (for example UNLOAD_FILAMENT) also
#       switches the monitor off, and PAUSE does nothing when not printing. Only a
#       RESUME or a Klipper restart arms it again.
#       TODO(owner): also arm it in PRINT_START?
[gcode_macro _FILAMENT_MONITOR]
# Loaded is 2.6°C, Unloaded is 28.0°C. 
# 15.0°C provides a clean mid-point threshold safe from noise spikes.
variable_adc1_runout_threshold: 15.0   

# Smart filtering parameters
variable_consecutive_strikes: 0   
variable_max_allowed_strikes: 3   # Requires 3 consecutive seconds of failure to trigger a pause
variable_enabled: True

gcode:
    {% if enabled %}
        # 1. Fetch live reading from our primary monitoring channel
        {% set val_adc1 = printer["temperature_sensor filament_adc1"].temperature|float %}
        
        # 2. Condition: If the reading rises ABOVE the threshold, the track is empty
        {% if val_adc1 > adc1_runout_threshold %}
            # Increment failure counter
            {% set current_strikes = consecutive_strikes + 1 %}
            SET_GCODE_VARIABLE MACRO=_FILAMENT_MONITOR VARIABLE=consecutive_strikes VALUE={current_strikes}
            
            # Optional console debug log
            M118 Runout warning strike {current_strikes}/{max_allowed_strikes}! ADC1: {val_adc1}
            
            # 3. Trigger pause only if failures cross our entire confirmation window
            {% if current_strikes >= max_allowed_strikes %}
                SET_GCODE_VARIABLE MACRO=_FILAMENT_MONITOR VARIABLE=enabled VALUE=False
                SET_GCODE_VARIABLE MACRO=_FILAMENT_MONITOR VARIABLE=consecutive_strikes VALUE=0
                M118 True filament runout confirmed! Pausing print...
                PAUSE
            {% endif %}
        {% else %}
            # Sensor passed verification: instantly clear any accumulated warning strikes
            {% if consecutive_strikes > 0 %}
                SET_GCODE_VARIABLE MACRO=_FILAMENT_MONITOR VARIABLE=consecutive_strikes VALUE=0
            {% endif %}
        {% endif %}
    {% endif %}

# 1 s polling loop for _FILAMENT_MONITOR. Starts at boot and reschedules itself.
# Do not add console messages here: it would print every second.
[delayed_gcode _RUNOUT_TICKER]
initial_duration: 1.0
gcode:
    _FILAMENT_MONITOR
    UPDATE_DELAYED_GCODE ID=_RUNOUT_TICKER DURATION=1.0

# RESUME lives in print-macros.cfg only. It re-arms the runout monitor there.

# Passive Cutter Sensors (Monitors visually on your dashboard without interrupting prints)
# Display only: nothing in the configs reads these values.
[temperature_sensor cutter_sensor_adc1]
sensor_type: hall_voltage_map
sensor_pin: THR:PA1
min_temp: -100
max_temp: 300

[temperature_sensor cutter_sensor_adc2]
sensor_type: hall_voltage_map
sensor_pin: THR:PA2
min_temp: -100
max_temp: 300

# Case light on THR:PB10, on/off only. Off at start and on shutdown. Controlled by the
# LIGHTS_ON, LIGHTS_OFF and LIGHTS_TOGGLE macros below.
[output_pin caselight1]
pin: THR:PB10
pwm: false
shutdown_value:0
value:0.0

[gcode_macro LIGHTS_ON]
gcode:
    SET_PIN PIN=caselight1 VALUE=1

[gcode_macro LIGHTS_OFF]
gcode:
    SET_PIN PIN=caselight1 VALUE=0

[gcode_macro LIGHTS_TOGGLE]
gcode:
    {% if printer['output_pin caselight1'].value == 0 %}
        SET_PIN PIN=caselight1 VALUE=1
    {% else %}
        SET_PIN PIN=caselight1 VALUE=0
    {% endif %}

