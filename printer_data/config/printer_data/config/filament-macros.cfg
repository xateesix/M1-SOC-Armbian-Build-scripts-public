## Filament Macros

[gcode_macro _FILAMENT_TYPE]
# Purpose: Convert FILAMENT/TYPE input into a soak time multiplier and chamber filter behavior.
# Used by: PRINT_START (via _FILAMENT_TYPE call), _HEAT_SOAK, _SHOW_HEAT_SOAK.
description: Set filament type ID from parameter and echo the selected integer
variable_type_id: 0
variable_time_multiplier: 1.0
gcode:
    {% set filament = params.FILAMENT|default(params.TYPE|default('UNKNOWN'))|string|upper|replace(' ', '') %}

    # Define soak time multipliers and filter modes per material group
    {% if filament in ['PLA-GF', 'PLAGF'] %}
        {% set time_multiplier = 2 %}
        {% set filter_mode = 1 %} # Exhaust Mode
    {% elif filament in ['PLA', 'PLA+'] %}
        {% set time_multiplier = 1 %}
        {% set filter_mode = 1 %} # Exhaust Mode
    {% elif filament in ['PETG_CF', 'PETG-CF', 'PETGCF'] %}
        {% set time_multiplier = 7 %}
        {% set filter_mode = 1 %} # Exhaust Mode
    {% elif filament == 'PETG' %}
        {% set time_multiplier  = 8 %}
        {% set filter_mode = 1 %} # Exhaust Mode
    {% elif filament in ['ABS', 'ABS+'] %}
        {% set time_multiplier = 12 %}
        {% set filter_mode = 0 %} # Recirculation / Closed Loop Mode
    {% elif filament == 'ASA' %}
        {% set time_multiplier = 9 %}
        {% set filter_mode = 0 %} # Recirculation / Closed Loop Mode
    {% elif filament == 'TPU' %}
        {% set time_multiplier = 5 %}
        {% set filter_mode = 1 %} # Exhaust Mode
    {% else %}
        {% set time_multiplier = 5 %}
        {% set filter_mode = 1 %} # Exhaust Default
    {% endif %}

    # Update structural tracking states
    SET_GCODE_VARIABLE MACRO=_FILAMENT_TYPE VARIABLE=time_multiplier VALUE={time_multiplier}
    
    # --- FIXED: Target the verified control_mode variable in your active system ---
    SET_GCODE_VARIABLE MACRO=_CHAMBERVARS VARIABLE=control_mode VALUE={filter_mode}
    
    RESPOND TYPE=echo MSG="FILAMENT={filament} TIME_MULTIPLIER={time_multiplier} FILTER_MODE={filter_mode}"

# ===================================================================
# John Abrams's X86 Adaptive Framework - Filament Handling
# ===================================================================

[gcode_macro LOAD_FILAMENT]
description: Safely heat the nozzle and load filament using X86 global variables
gcode:
    # Read the designated load temperature dynamically from your new global configuration
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% set current_target_temp = printer.extruder.target|int %}

    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" %}
            M104 S{extruder_temp}
            SET_DISPLAY_TEXT MSG="Nozzle heating to {extruder_temp}C..."
            {action_respond_info("Nozzle heating...")}
            M109 S{extruder_temp}
        {% else %}
            # If paused, maintain the print's current target temperature unless it was turned off
            {% if printer.extruder.target == 0 %}
                M104 S{extruder_temp}
                SET_DISPLAY_TEXT MSG="Nozzle heating to {extruder_temp}C..."
                {action_respond_info("Nozzle heating...")}
                M109 S{extruder_temp}
            {% else %}
                M104 S{printer.extruder.target}
                SET_DISPLAY_TEXT MSG="Nozzle heating to {printer.extruder.target}C..."
                {action_respond_info("Nozzle heating...")}
                M109 S{printer.extruder.target}
            {% endif %}
        {% endif %}
        
        SET_DISPLAY_TEXT MSG="Extruding filament..."
        G91 
        G1 E75 F300   ; Fast feed down the bowden/toolhead
        G1 E30 F150   ; Slow purge squeeze
        G1 E-2 F300   ; Gentle post-load retraction to prevent oozing
        G90
        M400
        SET_DISPLAY_TEXT MSG="Filament loaded."
        
        # If we were not paused, turn the heater back off to save electricity/prevent degradation
        {% if current_target_temp == 0 or printer.print_stats.state != "paused" %}
            M104 S0
        {% endif %}
    {% else %}
        {action_respond_info("Don't load filament during active printing cycles!")}
    {% endif %}

    
[gcode_macro UNLOAD_FILAMENT]
description: Safely heat the nozzle, shape a clean rounded tip, and eject filament using X86 global variables
gcode:
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% set current_target_temp = printer.extruder.target|int %}

    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" %}
            M104 S{extruder_temp}
            SET_DISPLAY_TEXT MSG="Nozzle heating to {extruder_temp}C..."
            {action_respond_info("Nozzle heating...")}
            M109 S{extruder_temp}
        {% else %}
            {% if printer.extruder.target == 0 %}
                M104 S{extruder_temp}
                SET_DISPLAY_TEXT MSG="Nozzle heating to {extruder_temp}C..."
                {action_respond_info("Nozzle heating...")}
                M109 S{extruder_temp}
            {% else %}
                M104 S{printer.extruder.target}
                SET_DISPLAY_TEXT MSG="Nozzle heating to {printer.extruder.target}C..."
                {action_respond_info("Nozzle heating...")}
                M109 S{printer.extruder.target}
            {% endif %}
        {% endif %}
        
        SET_DISPLAY_TEXT MSG="Forming clean tip..."
        
        # Call the single standalone ramming routine
        _FORM_TIP
        
        SET_DISPLAY_TEXT MSG="Ejecting filament..."
        G91
        G1 E-50 F300   ; Clear the extruder gears entirely
        G90
        M400
        SET_DISPLAY_TEXT MSG="Filament ejected."
        
        {% if current_target_temp == 0 or printer.print_stats.state != "paused" %}
            M104 S0
        {% endif %}
    {% else %}
        {action_respond_info("Don't unload filament during active printing cycles!")}
    {% endif %}

[gcode_macro _FORM_TIP]
description: Shapes a clean, rounded filament tip using ramming and active cooling
gcode:
    SAVE_GCODE_STATE NAME=form_tip_state
    G91 ; Relative positioning
    M83 ; Relative extruder mode

    # 1. The Ram: Shove plastic quickly into the melt zone to shape a clean tip
    G1 E2 F1500  
    G1 E4 F3000  
    
    # 2. Fast Retract: Pull the formed tip completely out of the melt zone
    G1 E-18 F4000 

    # 3. Cooling Moves: Work the filament back and forth in the cold section
    # This solidifies the tip so it doesn't deform or leave strings
    G1 E-10 F1200
    G1 E8 F1200
    G1 E-8 F1200
    G1 E5 F1200
    G1 E-5 F1200
    M400

    RESTORE_GCODE_STATE NAME=form_tip_state
