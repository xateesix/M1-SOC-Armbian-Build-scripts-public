# John Abrams's X86 Adaptive Framework - Intelligent Filament Dryer
# ===================================================================

[gcode_macro DRY_FILAMENT]
description: Heat the bed and chamber safely to dehydrate specific filament types for a set duration
gcode:
    # 1. Capture user inputs. Defaults to PLA settings (50C bed, 40C chamber, 4 hours)
    {% set bed_temp = params.BED|default(50)|int %}
    {% set chamber_temp = params.CHAMBER|default(40)|int %}
    {% set hours = params.HOURS|default(4)|int %}

    # 2. Safety thresholds to protect your printer components from overheating
    {% if bed_temp > 110 %} {% set bed_temp = 110 %} {% endif %}
    {% if chamber_temp > 75 %} {% set chamber_temp = 75 %} {% endif %}
    {% if hours > 12 %} {% set hours = 12 %} {% endif %}

    M400
    RESPOND TYPE=echo MSG="🔥 Filament Drying Cycle Activated!"
    RESPOND TYPE=echo MSG="📍 Targets -> Bed: {bed_temp}C | Chamber: {chamber_temp}C | Duration: {hours} Hours"
    
    # 3. Secure framework state tracking to prevent overlapping prints
    SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=active VALUE=0
    CLEAR_PAUSE

    # 4. Turn on airflow velocity to ensure uniform heat distribution
    {% if printer["fan_generic chamber_circulation_fan"] is defined %}
        RESPOND TYPE=echo MSG="🌀 Activating internal chamber circulation fans..."
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0.60
    {% endif %}

    # 5. Activate heating elements concurrently via direct hardware commands
    SET_DISPLAY_TEXT MSG="Dryer: Heating Bed to {bed_temp}C..."
    M140 S{bed_temp}

    # --- FIXED: Direct hardware target invocation as specified ---
    SET_DISPLAY_TEXT MSG="Dryer: Heating Chamber to {chamber_temp}C..."
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={chamber_temp}

    # 6. Wait for environmental stabilization before ticking the countdown
    M190 S{bed_temp}
    
    # --- FIXED: Correct target tracking addressing the standalone temperature_sensor array ---
    {% if printer["temperature_sensor Chamber_Temperature"] is defined %}
        SET_DISPLAY_TEXT MSG="Dryer: Soaking Chamber..."
        TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber_Temperature" MINIMUM={chamber_temp-1} MAXIMUM={chamber_temp+10}
    {% endif %}

    # 7. Initialize the background countdown ticker
    {% set total_ticks = hours * 60 %}
    SET_GCODE_VARIABLE MACRO=_PROMPT_DISMISS VARIABLE=ticks VALUE={total_ticks}
    
    RESPOND TYPE=echo MSG="⏳ Environment stabilized. Starting countdown timer..."
    UPDATE_DELAYED_GCODE ID=_DRYER_COUNTDOWN_LOOP DURATION=60


[delayed_gcode _DRYER_COUNTDOWN_LOOP]
gcode:
    # Read remaining time chunks from our hidden macro pool variable
    {% set current_ticks = printer["gcode_macro _PROMPT_DISMISS"].ticks|int %}

    {% if current_ticks > 0 %}
        # Calculate human-readable time formatting for your display status bar
        {% set hours_left = (current_ticks / 60)|int %}
        {% set mins_left = (current_ticks % 60)|int %}
        
        SET_DISPLAY_TEXT MSG="Dryer Remaining: {hours_left}h {mins_left}m"
        
        # Decrement the loop pool and check back in exactly 60 seconds
        SET_GCODE_VARIABLE MACRO=_PROMPT_DISMISS VARIABLE=ticks VALUE={current_ticks - 1}
        UPDATE_DELAYED_GCODE ID=_DRYER_COUNTDOWN_LOOP DURATION=60
    {% else %}
        # Timer finished! Call the safe emergency teardown method
        STOP_DRYER
    {% endif %}


[gcode_macro STOP_DRYER]
description: Immediately terminate all heating elements and cool down the machine safely
gcode:
    RESPOND TYPE=echo MSG="🛑 Filament drying cycle completed or manually stopped. Cooling down..."
    SET_DISPLAY_TEXT MSG="Drying Complete!"
    
    # 1. Break the ticking loop instantly
    SET_GCODE_VARIABLE MACRO=_PROMPT_DISMISS VARIABLE=ticks VALUE=0
    UPDATE_DELAYED_GCODE ID=_DRYER_COUNTDOWN_LOOP DURATION=0

    # 2. Turn off all heaters safely
    TURN_OFF_HEATERS
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0

    # 3. Keep fans running at 30% for 3 minutes to clear remaining radiant heat safely
    {% if printer["fan_generic chamber_circulation_fan"] is defined %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0.30
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_DRYER_COOLING_OFF DURATION=180


[delayed_gcode _DRYER_COOLING_OFF]
gcode:
    # Fully shut down air circulation once cool down complete
    {% if printer["fan_generic chamber_circulation_fan"] is defined %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
    {% endif %}
    RESPOND TYPE=echo MSG="❄️ Cool-down phase finished. Chamber idle."
