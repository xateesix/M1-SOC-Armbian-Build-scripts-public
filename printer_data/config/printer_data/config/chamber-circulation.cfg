# ===================================================================
# Chamber Circulation - Pre-Print Airflow Adjustment
# ===================================================================
# Copyright (c) 2026 XateEsix. Restores XateEsix's ADJUST_PRINT_CIRCULATION (written
# 2026-09-22) to work with the Smart Chamber Heater (Nesquirt, MIT).
# SPDX-License-Identifier: GPL-3.0-only
#
# Glue between PRINT_START and Smart Chamber Heater (smart-chamber-heater.cfg).
#
# Smart Chamber Heater drives its assist fans (variable_heat_assist_fans)
# only while the chamber is heating up. Once the chamber reaches
# target + variable_heat_assist_release_offset it releases them
# (_CHAMBERVARS.heat_assist_done = 1) and they are free for other macros.
# Source: Smart Chamber Heater docs, Docs/safety.md, "Heat Assist Fan Management".
#
# This macro therefore waits for that release before touching the fans, and
# uses the heater's own helper (_SET_HEAT_ASSIST_FANS) so the fan names stay
# in one place. If the fans are not released yet, it logs that and leaves them
# to the heater; the first-layer easing is skipped, never forced.
#
# History: replaces ADJUST_PRINT_CIRCULATION from the retired chamber-heater.cfg
# (archived in legacy-data/printer-config-retired-20261002). That version set
# the fan straight away, without checking the release, and tested the PTC heater
# target instead of the chamber target. PRINT_START (print-macros.cfg) calls
# this macro right before the final heating and purge.

[gcode_macro ADJUST_PRINT_CIRCULATION]
description: Ease chamber airflow before the first layer, after Smart Chamber Heater releases its assist fans
# Assist fan speed for the first layer, 0.0 to 1.0.
variable_speed: 0.4
gcode:
    {% set chamber_target = printer["gcode_macro _CHAMBER_TARGET"].target|float %}
    {% set released = printer["gcode_macro _CHAMBERVARS"].heat_assist_done|int %}

    # Nothing to do when chamber heating is not in use for this print.
    {% if chamber_target > 0 %}
        {% if released == 1 %}
            _SET_HEAT_ASSIST_FANS SPEED={speed}
            RESPOND PREFIX=info MSG="Chamber circulation set to {speed} for the first layer"
        {% else %}
            RESPOND PREFIX=info MSG="Chamber still heating, circulation left to Smart Chamber Heater"
        {% endif %}
    {% endif %}
