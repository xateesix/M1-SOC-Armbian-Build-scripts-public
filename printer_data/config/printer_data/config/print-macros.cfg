# ===================================================================
# John Abrams's X86 Macros - Complete Adaptive System (Block 1 of 5)
# ===================================================================

[force_move]
enable_force_move: True

[gcode_macro _global_var]
variable_pause_park: {'x': 10, 'y': 10, 'z': 10, 'e': 5}
variable_cancel_park: {'x': 350, 'y': 350, 'z': 10, 'e': 5}
variable_z_maximum_lifting_distance: 345
variable_pause_resume_travel_speed: 150
variable_load_filament_extruder_temp: 230
variable_target_bed: 60
variable_target_extruder_probe_temp: 150
gcode:
    {action_respond_info("Global macro variable systems initialized")}

[gcode_macro _PRINT_START_STATE]
variable_target_bed: 60
variable_target_extruder: 150
variable_target_extruder_probe_temp: 150
variable_target_chamber: 0
variable_x_wait: 175
variable_y_wait: 175
variable_active: 0
gcode:

[gcode_macro PRINT_START]
gcode:
    {% set target_bed = params.BED|default(printer.heater_bed.target if printer.heater_bed.target > 0 else 60)|int %}
    {% set filament = params.FILAMENT|default('PLA')|string|upper %}
    {% set target_extruder = params.EXTRUDER|default(150)|int %}
    {% set target_chamber = params.CHAMBER|default(0)|int %}
    
    {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
    {% set target_extruder_probe_temp = [ (target_extruder - 50), 150 ] | max %}
    
    CLEAR_PAUSE
    G90
    BED_MESH_CLEAR
    
    # Clean fan and filter initialization across agnostic printer hardware profiles
    M106 S0 ; Turn off part cooling fan
    {% if printer["fan_generic secondary_cooling_fan"] is defined %} SET_FAN_SPEED FAN=secondary_cooling_fan SPEED=0 {% endif %}
    {% if printer["fan_generic _Secondary_Fan"] is defined %} SET_FAN_SPEED FAN=_Secondary_Fan SPEED=0 {% endif %}
    {% if printer["fan_generic auxiliary_cooling_fan"] is defined %} SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=0 {% endif %}
    {% if printer["fan_generic filter_fan"] is defined %} SET_FAN_SPEED FAN=filter_fan SPEED=0 {% endif %}
    
    # Process your custom structural filament time and profile translations
    _FILAMENT_TYPE FILAMENT={filament}
    
    # --- NEW: Call interactive manual switch prompt ---
    PREPARE_CHAMBER_FILTER
    
    SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=target_bed VALUE={target_bed}
    SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=target_extruder VALUE={target_extruder}
    SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=target_extruder_probe_temp VALUE={target_extruder_probe_temp}
    SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=target_chamber VALUE={target_chamber}
    SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=x_wait VALUE={x_wait}
    SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=y_wait VALUE={y_wait}
    SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=active VALUE=1
    
    # Begin heating and target structural chamber profiles synchronously
    SET_DISPLAY_TEXT MSG="Bed heating to {target_bed}C"
    M140 S{target_bed}
    M104 S{target_extruder_probe_temp}
    
    # --- MODIFIED: Adjusted for your specific [heater_generic chamber_heater] configuration ---
    {% if target_chamber > 0 and printer["heater_generic chamber_heater"] is defined %}
        SET_DISPLAY_TEXT MSG="Targeting Chamber: {target_chamber}C"
        # Triggers M141 to safely handle your heater configuration and turn circulation to 100%
        M141 S{target_chamber}
		#M191 S{target_chamber}
        TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber_Temperature" MINIMUM={target_chamber-1} MAXIMUM={target_chamber+10}
    {% endif %}
    
    M190 S{target_bed}
    M109 S170
    
    {% if printer.toolhead.homed_axes|lower != "xyz" %}
        G28
    {% endif %}
    
    _PRINT_START_CONTINUE
# ===================================================================
# John Abrams's X86 Macros - Complete Adaptive System (Block 2 of 5)
# ===================================================================


[gcode_macro _PRINT_START_CONTINUE]
gcode:
    {% set ps = printer['gcode_macro _PRINT_START_STATE'] %}
    
    {% if ps.active|int == 0 %}
        {action_respond_info("_PRINT_START_CONTINUE bypassed.")}
        M104 S0
    {% else %}
        # Create a local flag to track if adjustments were made
        {% set ns = namespace(run_z_home=false) %}

        {% if printer.configfile.settings.quad_gantry_level is defined %}
            {% if not printer.quad_gantry_level.applied %}
                SET_DISPLAY_TEXT MSG="Aligning Z-Motors (QGL)"
                STATUS_LEVELING
                QUAD_GANTRY_LEVEL
                {% set ns.run_z_home = true %}
            {% endif %}
        {% elif printer.configfile.settings.z_tilt is defined %}
            {% if not printer.z_tilt.applied %}
                SET_DISPLAY_TEXT MSG="Aligning Z-Motors (Z-Tilt)"
                STATUS_LEVELING
                Z_TILT_ADJUST
                {% set ns.run_z_home = true %}
            {% endif %}
        {% endif %}
        
        # Perform the final Z homing with a clean nozzle
        HOME_Z_WITH_CLEAN
        
        # --- MODIFIED: Replaced generic filter override with your dynamic profile setup ---
        {% set chamber_mode = printer["gcode_macro _CHAMBERVARS"].control_mode|int %}
        {% if chamber_mode == 0 and printer["fan_generic filter_fan"] is defined %}
            SET_FAN_SPEED FAN=filter_fan SPEED=0.8
        {% endif %}
        
        SET_DISPLAY_TEXT MSG="Releasing full physical motion profiles"
        STATUS_PRINTING
        G90
        
        SET_DISPLAY_TEXT MSG="Final heating: Bed {ps.target_bed}C, Extruder {ps.target_extruder}C"
        M190 S{ps.target_bed}
        M109 S{ps.target_extruder}
        
        # --- NEW: Ease airflow velocity right before printing starts ---
        ADJUST_PRINT_CIRCULATION
        
        SMART_PARK
        VORON_PURGE
        
        SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=active VALUE=0
        M400 
        {% if printer.pause_resume.is_paused %}
            RESUME_BASE
        {% endif %}
    {% endif %}

# ===================================================================
# Asynchronous Chamber Vent / Filter Checklist (Pure Looping Lock)
# ===================================================================

[gcode_macro PREPARE_CHAMBER_FILTER]
description: Interactive prompt ensuring manual exhaust vents match the chosen filament profile
gcode:
    RESPOND TYPE=echo MSG="🔍 [Step 1] Entering PREPARE_CHAMBER_FILTER..."
    
    # Read the target filter mode directly from your smart chamber variable configuration
    {% set chamber_mode = printer["gcode_macro _CHAMBERVARS"].control_mode|int %}
    RESPOND TYPE=echo MSG="🔍 [Step 2] Detected _CHAMBERVARS.control_mode = {chamber_mode}"

    # Force our lock status to 1 (Locked) inside our state framework
    SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=active VALUE=1

    {% if chamber_mode == 0 %}
        SET_DISPLAY_TEXT MSG="⚠️ CLOSE Vents/Exhaust! (Recirculate)"
        RESPOND TYPE=echo MSG="🔍 [Step 3] Choosing ABS/ASA layout. Initializing UI prompt..."
        
        # Build the visual prompt window for ABS/ASA (Clean alphanumeric strings only)
        RESPOND TYPE=command MSG="action:prompt_begin Chamber Configuration Checklist"
        RESPOND TYPE=command MSG="action:prompt_text You are printing a high-temperature material (ABS/ASA). Please CLOSE your manual exhaust vent/filter flap to allow internal recirculation/scrubbing."
        RESPOND TYPE=command MSG="action:prompt_button CONFIRM|PROMPT_VERIFY_CHECKLIST|primary"
        RESPOND TYPE=command MSG="action:prompt_show"
        
    {% else %}
        SET_DISPLAY_TEXT MSG="⚠️ OPEN Vents/Exhaust! (Cooling)"
        RESPOND TYPE=echo MSG="🔍 [Step 3] Choosing PLA/PETG/TPU layout. Initializing UI prompt..."
        
        # Build the visual prompt window for PLA/PETG/TPU (Clean alphanumeric strings only)
        RESPOND TYPE=command MSG="action:prompt_begin Chamber Configuration Checklist"
        RESPOND TYPE=command MSG="action:prompt_text You are printing a low-temperature material (PLA/PETG/TPU). Please OPEN your manual exhaust vent/filter flap to protect against heat creep and clogging."
        RESPOND TYPE=command MSG="action:prompt_button CONFIRM|PROMPT_VERIFY_CHECKLIST|primary"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

    RESPOND TYPE=echo MSG="🔒 [Step 4] Handshake Loop Active. Postponing print heatups..."
    
    # Fire off our asynchronous background loop check
    UPDATE_DELAYED_GCODE ID=_FILTER_CHECK_LOOP DURATION=0.5


[delayed_gcode _FILTER_CHECK_LOOP]
gcode:
    # Read our lock status state from our safe internal tracking macro variable
    {% set lock_status = printer["gcode_macro _PRINT_START_STATE"].active|int %}
    
    {% if lock_status == 1 %}
        # If still locked (1), keep checking back every half-second without blocking Klipper's thread
        UPDATE_DELAYED_GCODE ID=_FILTER_CHECK_LOOP DURATION=0.5
    {% else %}
        # If unlocked (0), break the loop and let the machine continue with heating sequences
        RESPOND TYPE=echo MSG="🔓 [Step 6] Looping Lock Released! Processing preheating and homing loops..."
        
        # 1. Grab state parameters from your active X86 framework
        {% set ps = printer['gcode_macro _PRINT_START_STATE'] %}
        
        # 2. Fire the delayed heater profiles
        SET_DISPLAY_TEXT MSG="Bed heating to {ps.target_bed}C"
        M140 S{ps.target_bed}
        M104 S{ps.target_extruder_probe_temp}
        
        # 3. Complete structural stabilization blocks synchronously
        M190 S{ps.target_bed}
        M109 S{ps.target_extruder_probe_temp}
        
        # 4. Handle initial safe homing pass before adaptive alignment tasks execute
        {% if printer.toolhead.homed_axes|lower != "xyz" %}
            G28
        {% endif %}
        
        # 5. Hand off control to Block 2 of John Abrams's framework
        _PRINT_START_CONTINUE
    {% endif %}


[gcode_macro PROMPT_VERIFY_CHECKLIST]
description: Callback triggered when clicking the dashboard button to release the print thread
gcode:
    RESPOND TYPE=echo MSG="🔍 [Step 5] UI Button Click Detected! Closing prompt window and unlocking thread..."
    
    # 1. Force Moonraker to collapse and fully clear the open dialog card
    RESPOND TYPE=command MSG="action:prompt_end"
    
    # 2. Change the tracking variable to 0, satisfying the loop breakout condition
    SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=active VALUE=0

# ===================================================================
# John Abrams's X86 Macros - Complete Agnostic Framework (Block 4 of 5)
# ===================================================================

[delayed_gcode _DELAYED_FILTER_OFF]
gcode:
    SET_FAN_SPEED FAN=filter_fan SPEED=0.0
    RESPOND TYPE=command MSG="Chamber filter fan post-print exhaust complete. Fan turned off."


[gcode_macro END_PRINT]
variable_state: 'normal'
gcode:
    {% set z_max = printer['gcode_macro _global_var'].z_maximum_lifting_distance|int %}
    {% set x_max = printer.toolhead.axis_maximum.x|float - 10 %}
    {% set y_max = printer.toolhead.axis_maximum.y|float - 10 %}
    {% set e_mintemp = printer.configfile.settings['extruder'].min_extrude_temp %}
    
    M400
    M117 Done
    G91
    
    {% if 'filament_motion_sensor encoder_sensor' in printer %}
        {% if printer['filament_motion_sensor encoder_sensor'].enabled == True and printer['filament_motion_sensor encoder_sensor'].filament_detected == True %}
            {% if (printer.extruder.target != 0 and printer.extruder.temperature >= printer.extruder.target) or printer.extruder.temperature >= e_mintemp %}
                G1 E-2 F2700
                G1 E-2 Z0.2 F2400
            {% endif %}
        {% endif %}
    {% else %}
        {% if printer.extruder.temperature >= e_mintemp %}
            G1 E-4 F2400
        {% endif %}
    {% endif %}
    
    {% if (printer.gcode_move.position.z + 25) < z_max %}
        G1 Z+25 F600
    {% else %}
        G1 Z+{(z_max - printer.gcode_move.position.z)} F600
    {% endif %}
    
 	G90
    G1 X200 Y260 F6000
    G1 X200 Y275 F6000
    
    OFF
    
    # --- MODIFIED: Turn off your specific [heater_generic chamber_heater] element ---
    {% if printer["heater_generic chamber_heater"] is defined %} 
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0 
    {% endif %}
    
    # --- NEW: Explicitly shut down the under-bed chamber circulation fan ---
    {% if printer["fan_generic chamber_circulation_fan"] is defined %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
    {% endif %}
    
    # --- Custom Fan Shutdown Logic ---
    {% if printer["fan_generic secondary_part_fan"] is defined %} SET_FAN_SPEED FAN=secondary_part_fan SPEED=0 {% endif %}
    {% if printer["fan_generic auxiliary_fan"] is defined %} SET_FAN_SPEED FAN=auxiliary_fan SPEED=0 {% endif %}
    
    # --- MODIFIED: Dynamic filter behavior based on filament printing state ---
    {% set chamber_mode = printer["gcode_macro _CHAMBER_VARIABLES"].required_mode|int %}
    {% if chamber_mode == 1 and printer["fan_generic filter_fan"] is defined %}
        # Exhaust Mode: Run at 100% to purge fumes from the room, then trigger a 5-minute timer to shut off
        SET_FAN_SPEED FAN=filter_fan SPEED=1.0
        UPDATE_DELAYED_GCODE ID=_DELAYED_FILTER_OFF DURATION=300
        RESPOND TYPE=command MSG="Print completed in EXHAUST mode. Purging chamber fumes for 5 minutes..."
    {% else %}
        # Recirculation or unknown mode: Shut down immediately to preserve heat or safe workspace idle
        {% if printer["fan_generic filter_fan"] is defined %} SET_FAN_SPEED FAN=filter_fan SPEED=0 {% endif %}
    {% endif %}
    
    M84 X Y Z E
    M220 S100
    M221 S100
    CLEAR_PAUSE
    {action_respond_info("Finish Print operations complete!")}


[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
    {% set origin_square_corner_velocity_val = printer.toolhead.square_corner_velocity|float %}
    {% set origin_accel = printer.toolhead.max_accel|float %}
    
    {% if printer.toolhead.homed_axes|lower != "xyz" %}
        G28
    {% endif %}
    
    {% if printer.configfile.settings.quad_gantry_level is defined and printer.quad_gantry_level.applied|lower != 'true' %}
        SET_VELOCITY_LIMIT max_z_velocity=10
        QUAD_GANTRY_LEVEL
        G28 Z
    {% elif printer.configfile.settings.z_tilt is defined and printer.z_tilt.applied|lower != 'true' %}
        SET_VELOCITY_LIMIT max_z_velocity=10
        Z_TILT_ADJUST
        G28 Z
    {% endif %}
    
    # Configure low-noise velocity limits for the continuous inductive sweep
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1.0 ACCEL=1500 max_z_velocity=5
    
    # MODIFIED: Swapped out KAMP parameter wrappers for native Klipper adaptive geometry mapping
    # This prevents the BDsensorM rapid scan data stream from overflowing or misreading coordinates
    BED_MESH_CALIBRATE_BASE ADAPTIVE=1 METHOD=rapid_scan
    
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={origin_square_corner_velocity_val} ACCEL={origin_accel} max_z_velocity={printer.configfile.settings.printer.max_z_velocity}

[gcode_macro G34]
gcode:
    BED_MESH_CLEAR
    {% if printer.toolhead.homed_axes|lower != "xyz" %} G28 {% else %} G28 Z {% endif %}
    {% if printer.configfile.settings.quad_gantry_level is defined %}
        QUAD_GANTRY_LEVEL
        G28 Z
    {% elif printer.configfile.settings.z_tilt is defined %}
        Z_TILT_ADJUST
        G28 Z
    {% else %}
        {action_respond_info("G34 command ignored: No multi-axis leveling structures defined in hardware config.")}
    {% endif %}
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z30 F4500



# ===================================================================
# John Abrams's X86 Macros - Complete Agnostic Framework (Block 5 of 5)
# ===================================================================

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    CANCEL_PRINT_BASE
    
    # --- UNCOMMENTED AND ACTIVATED PARK VARIABLES ---
    {% set x_park = printer.toolhead.axis_maximum.x|float - 10 %}
    {% set y_park = printer.toolhead.axis_maximum.y|float - 10 %}
    
    {% set z_lift_max = printer['gcode_macro _global_var'].z_maximum_lifting_distance %}
    {% set e_retract = printer['gcode_macro _global_var'].cancel_park.e|float %}
    {% set e_mintemp = printer.configfile.settings['extruder'].min_extrude_temp %}
    
    M117 Print canceled!
    G91
    
    {% if 'filament_motion_sensor encoder_sensor' in printer and printer['filament_motion_sensor encoder_sensor'].enabled and printer['filament_motion_sensor encoder_sensor'].filament_detected %}
        {% if printer.extruder.temperature >= e_mintemp %} G1 E-{e_retract} F500 {% endif %}
    {% else %}
        {% if printer.extruder.temperature >= e_mintemp %} G1 E-4 F500 {% endif %}
    {% endif %}
    
    {% if "z" in printer.toolhead.homed_axes %}
        {% if (printer.gcode_move.position.z + 10) < z_lift_max %} G1 Z+10 F600 {% else %} G1 Z+{(z_lift_max - printer.gcode_move.position.z - 2)} F600 {% endif %}
    {% endif %}
    
	G90
    G1 X200 Y260 F6000
    G1 X200 Y275 F6000

    # --- MODIFIED: Turn off your specific [heater_generic chamber_heater] element ---
    {% if printer["heater_generic chamber_heater"] is defined %} 
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0 
    {% endif %}
    
    # --- NEW: Explicitly shut down the under-bed chamber circulation fan ---
    {% if printer["fan_generic chamber_circulation_fan"] is defined %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
    {% endif %}
    
    # --- Custom Fan Shutdown Logic ---
    {% if printer["fan_generic secondary_part_fan"] is defined %} SET_FAN_SPEED FAN=secondary_part_fan SPEED=0 {% endif %}
    {% if printer["fan_generic auxiliary_fan"] is defined %} SET_FAN_SPEED FAN=auxiliary_fan SPEED=0 {% endif %}
    
    # --- MODIFIED: Dynamic filter behavior based on filament cancel state ---
    {% set chamber_mode = printer["gcode_macro _CHAMBER_VARIABLES"].required_mode|int %}
    {% if chamber_mode == 1 and printer["fan_generic filter_fan"] is defined %}
        # Exhaust Mode: Run at 100% to purge fumes from the room, then trigger the 5-minute timer to shut off
        SET_FAN_SPEED FAN=filter_fan SPEED=1.0
        UPDATE_DELAYED_GCODE ID=_DELAYED_FILTER_OFF DURATION=300
        RESPOND TYPE=command MSG="Print canceled in EXHAUST mode. Purging chamber fumes for 5 minutes..."
    {% else %}
        # Recirculation or unknown mode: Shut down immediately to maintain stable idle environment
        {% if printer["fan_generic filter_fan"] is defined %} SET_FAN_SPEED FAN=filter_fan SPEED=0 {% endif %}
    {% endif %}
    
    CLEAR_PAUSE
    
    # Armed immediate kill loop via Cancel sequence
    UPDATE_DELAYED_GCODE ID=ALL_STOP_TIMER DURATION=1



# ===================================================================
# Structural Pause / Resume System
# ===================================================================

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    RESPOND PREFIX=info MSG="📌 Macro executed : PAUSE {params}"
    {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
        M400 
        
        # Grab global travel settings from your new framework
        {% set park = printer['gcode_macro _global_var'].pause_park %}
        {% set travel_speed = printer['gcode_macro _global_var'].pause_resume_travel_speed|float * 60 %}
        
        {% set z = params.Z|default(park.z)|int %}                                                   
        {% set E = (params.E|default(park.e))|float %}
        {% set retract_val = params.RETRACT|default(2)|float %}
        
        # Target parking locations resolved dynamically
        {% set x_park = park.x|float %}
        {% set y_park = park.y|float %}
        
        {% if (printer.gcode_move.position.x) <= (x_park+1) and (printer.gcode_move.position.y) >= (y_park-1) %}
            M400
        {% else %}
            {% set position = printer.gcode_move.gcode_position %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_x VALUE="{position.x}"
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_y VALUE="{position.y}"
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_z VALUE="{position.z}"
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_e VALUE="{E}"
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retract_applied VALUE="{retract_val}"
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer.extruder.target}   
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=ntemp VALUE={params.R|default(printer.extruder.target)}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=bed_temp VALUE={printer.heater_bed.target}  
            
            M104 S{params.R|default(printer.extruder.target)|float} 
            G92 E0
            SAVE_GCODE_STATE NAME=timelapse_state_a 
            BASE_PAUSE
        {% endif %}
        
        G90
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}
            G1 Z{printer.gcode_move.position.z + z} F3000
        {% endif %}
        
        # Cleanly disable active auxiliary systems defined in your new PRINT_START profile
        M106 S0
        {% if printer["fan_generic secondary_cooling_fan"] is defined %} SET_FAN_SPEED FAN=secondary_cooling_fan SPEED=0 {% endif %}
        {% if printer["fan_generic _Secondary_Fan"] is defined %} SET_FAN_SPEED FAN=_Secondary_Fan SPEED=0 {% endif %}
        {% if printer["fan_generic auxiliary_cooling_fan"] is defined %} SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=0 {% endif %}
        
        # Park toolhead using your new config speed limits
        G1 X{x_park} Y{y_park} F{travel_speed}
        
        # Safe retraction 
        G91
        G1 E-{retract_val} F2400
        G90
        M400
        M25
        M104 S0
        M400
        
        # Safely checks for your new filament encoder sensor if present
        {% if 'filament_motion_sensor encoder_sensor' in printer %}
            SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
        {% endif %}
        
        SET_IDLE_TIMEOUT TIMEOUT=43200 
    {% else %}
        RESPOND TYPE=echo MSG="Not printing or already paused"
    {% endif %}


[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 250
variable_ntemp: 250
variable_bed_temp: 60
variable_saved_x: 0.0
variable_saved_y: 0.0
variable_saved_z: 0.0
variable_saved_e: 0.0
variable_retract_applied: 2.0
gcode:
    RESPOND PREFIX=info MSG="📌 Macro executed : RESUME {params}"
    {% if printer.pause_resume.is_paused %}
        {% set travel_speed = printer['gcode_macro _global_var'].pause_resume_travel_speed|float * 60 %}
        G90
        G1 Z{saved_z+2} F{travel_speed}
        M400
        M109 S{ntemp|int}
        M400 
        
        RESTORE_GCODE_STATE NAME=timelapse_state_a MOVE=1 MOVE_SPEED={printer['gcode_macro _global_var'].pause_resume_travel_speed}
        
        G91
        G1 E{retract_applied} F2400
        G90
        
        {% if 'filament_motion_sensor encoder_sensor' in printer %}
            SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1
        {% endif %}
        
        M109 S{ntemp|int}
        M400 
        M24
        CLEAR_PAUSE
    {% else %}
        RESPOND TYPE=echo MSG="Not in Pause"        
    {% endif %}

[gcode_macro FILAMENT_CHANGE]
description: Execute a mechanical filament tip cut sequence using current framework limits
gcode:
    RESPOND PREFIX=info MSG="📌 Macro executed : FILAMENT_CHANGE {params}"
    {% set s = (printer["gcode_macro RESUME"].etemp)|float %}
    {% set travel_speed = printer['gcode_macro _global_var'].pause_resume_travel_speed|float * 60 %}
    
    {% if s > 180 %}
        M104 S{s}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-2} MAXIMUM={s+2}
        G90 
        
        # Safely uses your new framework's park variables before running the slide cut
        {% set park = printer['gcode_macro _global_var'].pause_park %}
        G1 X{park.x} Y{park.y} F{travel_speed}
        M400
        
        # WARNING: Verify these physical cutting coordinates match your new printer size layout!
        G1 X200 Y260 F{travel_speed} ; Go to cut entry line
        G1 X260 Y30 F{travel_speed}
        G1 X260 F{travel_speed}
        M400
        G1 X262.7 Y30 F600           ; Mechanical compression stroke
        M400
        G1 X262.7 Y-0.5 F600         ; Blade wipe slip
        G90
    {% endif %}


[gcode_macro _IDLE_TIMEOUT]
gcode:
    {% if printer.print_stats.state == "paused" %} RESPOND TYPE=echo MSG="No operations in 10min!" {% else %} ALL_STOP {% endif %}

[gcode_macro _ALL_FAN_OFF]
gcode:
    M106 S0
    M107
    {% if printer["fan_generic secondary_cooling_fan"] is defined %} SET_FAN_SPEED FAN=secondary_cooling_fan SPEED=0 {% endif %}
    {% if printer["fan_generic _Secondary_Fan"] is defined %} SET_FAN_SPEED FAN=_Secondary_Fan SPEED=0 {% endif %}
    {% if printer["fan_generic auxiliary_cooling_fan"] is defined %} SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=0 {% endif %}
    {% if printer["fan_generic filter_fan"] is defined %} SET_FAN_SPEED FAN=filter_fan SPEED=0 {% endif %}

# --- THE ALL STOP ECOSYSTEM ROUTINE ---
[gcode_macro ALL_STOP]
gcode:
    # 1. Kill the timer countdown thread completely
    UPDATE_DELAYED_GCODE ID=ALL_STOP_TIMER DURATION=0
    # 2. Hard cutoff on all active heater circuits globally
    TURN_OFF_HEATERS
    {% if printer["heater_generic chamber"] is defined %} SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0 {% endif %}
    # 3. Suppress all cooling element fan speeds
    _ALL_FAN_OFF
    # 4. Turn off step motors
    M84
    M117 System Stopped.
    {action_respond_info("ALL_STOP macro completed. Heaters, fans, and motors cut.")}

[delayed_gcode ALL_STOP_TIMER]
initial_duration: 0
gcode:
    ALL_STOP

[gcode_macro OFF]
gcode:
    ALL_STOP

[gcode_macro _HEAT_BED_AND_PROBE]
gcode:
    {% set soak = params.SOAK|default(0)|int %}
    {% set target_bed = params.BED|default(60)|int %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
    M106 S255
    M104 S0
    {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z15 F4500
    {% endif %}
    M190 S{target_bed}
    {% if soak > 0 %} G4 P{soak * 60000} {% endif %}
    SET_DISPLAY_TEXT MSG="Hotend off for probe"
    M107
    M104 S0

[delayed_gcode bed_mesh_init]
initial_duration: 0.01
gcode:
    BED_MESH_PROFILE LOAD=default

[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|default(0)|float %}
    M104 S{s}
    {% if s > 0 %} TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-1} MAXIMUM={s+3} {% endif %}

[gcode_macro M190]
rename_existing: M99190
gcode:
    {% set s = params.S|default(0)|float %}
    M140 S{s}
    {% if s > 0 %} TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-1} MAXIMUM={s+3} {% endif %}

[gcode_macro M600]
gcode:
    PAUSE STATE=filament_change

[gcode_macro TEST_SPEED]
gcode:
    {% set speed = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set accel = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    {% set bound = params.BOUND|default(20)|int %}
    SAVE_GCODE_STATE NAME=TEST_SPEED
    G28
    {% if printer.configfile.settings.quad_gantry_level is defined and not printer.quad_gantry_level.applied %}
        QUAD_GANTRY_LEVEL
        G28 Z
    {% elif printer.configfile.settings.z_tilt is defined and not printer.z_tilt.applied %}
        Z_TILT_ADJUST
        G28 Z
    {% endif %}
    G90
    {% set x_min = (printer.toolhead.axis_minimum.x if printer.toolhead.axis_minimum.x >= 0 else 0) + bound %}
    {% set y_min = (printer.toolhead.axis_minimum.y if printer.toolhead.axis_minimum.y >= 0 else 0) + bound %}
    {% set x_max = printer.toolhead.axis_maximum.x - bound %}
    {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel}
    {% for i in range(iterations) %}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
    {% endfor %}
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel}
    M400 G28 RESTORE_GCODE_STATE NAME=TEST_SPEED
