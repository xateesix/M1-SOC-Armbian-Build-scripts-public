# ===================================================================
# TinyFan RP2040 - fan, tach, aux, LED board
# ===================================================================
# Based on Klipper/TinyFan.cfg from the TinyFan project, GPL-3.0:
#   Gi7mo, with contributions from Ramalama2 and Pixeltrace-GER
#   https://github.com/Gi7mo/TinyFan
# Adapted for this printer by XateEsix (serial number, fans used here).

# WHAT: Declares the TinyFan RP2040 board, a USB MCU with PWM fan ports and tach
#       inputs, and the two chamber fans wired to it.
# WHY:   The Manta M4P has no spare fan ports for the chamber heater setup.
# DEPENDS: smart-chamber-heater.cfg finds chamber_circulation_fan (heat assist) and
#       chamber_heater_fan (PTC heater fan) by name. print-macros.cfg and
#       chamber-circulation.cfg also set chamber_circulation_fan.
# NOTE: The serial path is this board's own ID.
#       The commented examples at the end are kept from the TinyFan project.

[mcu TinyFan]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044506118D8901C-if00
restart_method: command

[temperature_sensor TinyFan]
sensor_type: temperature_mcu
sensor_mcu: TinyFan
min_temp: 0
max_temp: 125

# Names the board's connectors (FAN1-4, AUX1-3, G1-G6, LED) so configs can write
# TinyFan:FAN1_PWM instead of gpio numbers. The map comes from the TinyFan project.
[board_pins tinyfan]
mcu: TinyFan
aliases:
    #FAN Ports:
    FAN1_PWM=gpio0, FAN1_RPM=gpio7,
    FAN2_PWM=gpio1, FAN2_RPM=gpio8,
    FAN3_PWM=gpio2, FAN3_RPM=gpio9,
    FAN4_PWM=gpio3, FAN4_RPM=gpio10,

    #AUX Ports:
    AUX1_PWM=gpio4, AUX1_RPM=gpio26,
    AUX2_PWM=gpio5, AUX2_RPM=gpio27,
    AUX3_PWM=gpio6, AUX3_RPM=gpio28,

    #GPIO Header:
    G1=gpio29, G2=gpio11, G3=gpio12,
    G4=gpio13, G5=gpio14, G6=gpio15,

    #Waveshare LED:
    LED=gpio16

# The RGB LED on the board (gpio16). It starts green and nothing in the configs
# changes it afterwards, and no LED macros are loaded. Kept on purpose (owner). The
# board is inside the enclosure, so the LED is not seen.
[neopixel TinyFan]
pin: TinyFan:LED
initial_RED: 0
initial_GREEN: 1
initial_BLUE: 0

# WHAT: Chamber circulation fan on FAN1. Smart Chamber Heater runs it as heat-assist
#       fan during heat-up. After that ADJUST_PRINT_CIRCULATION and DRY_FILAMENT set
#       its speed, and print-macros.cfg turns it off after a print and when stopping.
# NOTE: enable_pin (AUX3_PWM) is a workaround (owner). The TinyFan PWM headers are always powered,
#       so a stock 4-wire fan never stops completely at 0%. The enable output is
#       switched with the fan so it shuts off fully.
# Auxiliary fan
[fan_generic chamber_circulation_fan]
pin: TinyFan:FAN1_PWM
#pin: TinyFan:AUX3_PWM
tachometer_pin: ^TinyFan:FAN1_RPM
#tachometer_ppr:2
enable_pin: TinyFan:AUX3_PWM
off_below: 0.15
shutdown_speed:0
#fan_speed: 1.0
#idle_speed: 0.6
cycle_time: 0.001
#hardware_pwm: true
#heater: chamber        # Matches the exact name of your [heater_generic]

# WHAT: Fan on FAN2 that blows over the chamber PTC heater. Smart Chamber Heater
#       drives it (variable_heater_fan_name). print-macros.cfg also turns it off
#       after a print and when stopping.
# NOTE: enable_pin (AUX2_PWM) is a workaround (owner). The TinyFan PWM headers are always powered,
#       so a stock 4-wire fan never stops completely at 0%. The enable output is
#       switched with the fan so it shuts off fully.
# Auxiliary fan
[fan_generic chamber_heater_fan]
pin: TinyFan:FAN2_PWM
#pin: TinyFan:AUX3_PWM
tachometer_pin: ^TinyFan:FAN2_RPM
#tachometer_ppr:2
enable_pin: TinyFan:AUX2_PWM
off_below: 0.15
shutdown_speed:0
#fan_speed: 1.0
#idle_speed: 0.6
cycle_time: 0.001
#hardware_pwm: true
#heater: chamber_heater       # Matches the exact name of your [heater_generic]
#heater_temp: 40.0             # Turns fan ON above 40°C, and OFF once it cools back below 40°C


# TinyFan placeholder pin map for two PWM fans with tach inputs.
# Update these GPIO pins to match the TinyFan board wiring.
