# ===================================================================
# Hall filament width sensor (THR:PB0 + THR:PB1) - filament runout and diameter
# ===================================================================
# Copyright (c) 2026 XateEsix. Original work.
# SPDX-License-Identifier: GPL-3.0-only
# Credit: the choice of Klipper's hall_filament_width_sensor on both toolhead hall
#       channels, its calibration points and its measurement delay follow the
#       Tortillery M1 Pro kit. No kit file is copied. See CREDITS.md.
# WHAT: Reads both hall channels, converts their sum to a diameter and raises a
#       native runout (PAUSE, then _FILAMENT_RUNOUT) when the diameter falls below
#       min_diameter. A native runout fires only while printing.
# STAGE: 1 = measure only (enable: False). The strike monitor in mcu_thr.cfg stays
#       in charge and nothing here can pause a print yet.
#       Check: QUERY_RAW_FILAMENT_WIDTH with filament loaded and with the path
#       empty. 1.0 mm is RAW 905 with the calibration points below, so loaded must
#       read well under that and empty well over it.
#       RESULT 2026-10-16: ADC1 (PB0) reads a constant 10000 (full scale) and ADC2
#       (PB1) reads 100 with filament loaded, so RAW is 10100 and the sum is unusable.
#       Stage 2 is blocked until PB0 is understood.
#       Stage 2, once the check passes: set enable: True here, retire
#       _FILAMENT_MONITOR, _RUNOUT_TICKER and filament_adc1 in mcu_thr.cfg together
#       with the pin override below, and make RESUME refuse to continue without
#       filament (a native runout fires on the change, not while it stays missing).
# DEPENDS: mcu_thr.cfg (the THR MCU and filament_adc1), print-macros.cfg (PAUSE).

# TEMPORARY (stage 1): THR:PB1 is also read by filament_adc1 in mcu_thr.cfg, which
# Klipper only allows with this override. Remove it in stage 2.
[duplicate_pin_override]
pins: THR:PB1

# cal_dia/raw_dia are the kit's values and only affect the diameter number, not the
# runout point. Flow compensation is off: the extrusion multiplier is never touched.
# max_diameter is set high so only a missing filament can trigger a runout.
[hall_filament_width_sensor]
adc1: THR:PB0
adc2: THR:PB1
enable: False
cal_dia1: 1.46
raw_dia1: 482
cal_dia2: 1.75
raw_dia2: 215
default_nominal_filament_diameter: 1.75
measurement_delay: 60
measurement_interval: 10
enable_flow_compensation: False
min_diameter: 1.0
max_diameter: 3.0
pause_on_runout: True
runout_gcode:
    _FILAMENT_RUNOUT

# Called by the width sensor right after its PAUSE. Only says why the print paused.
[gcode_macro _FILAMENT_RUNOUT]
gcode:
    M118 Filament runout: sensor diameter {printer.hall_filament_width_sensor.Diameter} mm. Load filament, then RESUME.
