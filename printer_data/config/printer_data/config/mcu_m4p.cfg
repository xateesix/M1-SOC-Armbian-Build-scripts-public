# WHAT: Declares the primary Klipper MCU (steppers, heaters, fans on the M4P)
#       and a temperature sensor for its own chip.
# WHY:  The M4P replaced the factory board. The BTT CB1 host talks to it over USB.
# NOTE: The serial path is this board's unique ID. Reflashing Klipper keeps it,
#       replacing the board changes it. The toolhead MCU is in mcu_thr.cfg.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_570044000450304158373220-if00
restart_method: command

# Klipper shuts down if the M4P chip leaves 0-80 C.
[temperature_sensor M4P]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 80
