[gcode_macro G28]
rename_existing: G990028

gcode:
    # 1. Dynamically read your normal printing currents from printer.cfg
    {% set RUN_CUR_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CUR_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CUR = 0.400 %} # Drop current to 0.4A for safe sensorless stall detection

	# 2. Automatically calculate the exact bed center relative to the nozzle printable space
	{% set max_x = printer.toolhead.axis_maximum.x|float %}
	{% set min_x = printer.toolhead.axis_minimum.x|float %}
	{% set max_y = printer.toolhead.axis_maximum.y|float %}
	{% set min_y = printer.toolhead.axis_minimum.y|float %}

	# Calculate geometric bed center (This equals 127.5 based on your config)
	{% set center_x = min_x + ((max_x - min_x) / 2) %}
	{% set center_y = min_y + ((max_y - min_y) / 2) %}

	# FIXED: Changed section name to lowercase 'bdsensor' so Klipper can read it
	{% set bd_settings = printer.configfile.settings['bdsensor']|default(none) %}
	{% set probe_offset_x = bd_settings.x_offset|default(0.0)|float if bd_settings else 0.0 %}
	{% set probe_offset_y = bd_settings.y_offset|default(0.0)|float if bd_settings else 0.0 %}

	# Nozzle coordinate adjustments to place sensor over geometric center
	{% set safe_home_x = center_x - probe_offset_x %}
	{% set safe_home_y = center_y - probe_offset_y %}

	# Output debug data to the console during homing to see the live math
	{ action_respond_info("Bed Center: X%s Y%s | BDsensor Offsets: X%s Y%s | Nozzle Target: X%s Y%s" | format(center_x, center_y, probe_offset_x, probe_offset_y, safe_home_x, safe_home_y)) }

    # 3. Parse axis parameters following your conditional model
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set home_x = home_all or 'X' in params or 'x' in params %}
    {% set home_y = home_all or 'Y' in params or 'y' in params %}
    {% set home_z = home_all or 'Z' in params or 'z' in params %}

    # Force safe initial Z lift to prevent scratching the bed
    SET_KINEMATIC_POSITION Z=0
    G90
    G0 Z10 F600

    # ---- SENSORLESS HOMING: Y AXIS FIRST ----
    {% if home_y or (home_x and home_all) %}
        { action_respond_info("homing y") }
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
        G4 P2000
        
        G990028 Y
        
        M400 
        G91
        G1 Y10 F1200
        G90
        M400
        
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR_X}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR_Y}
        G4 P100
    {% endif %}

    # ---- SENSORLESS HOMING: X AXIS SECOND ----
    {% if home_x %}
        { action_respond_info("homing x") }
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
        G4 P2000 
        
        G990028 X
        
        M400 
        G91
        G1 X10 F1200
        G90
        M400 
        
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR_X}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR_Y}
        G4 P100
    {% endif %}

    # ---- CENTER X ALIGNMENT ----
    # If X was just homed, immediately move it to the calculated safe home X center position
    {% if home_x %}
        G90
        G0 X{safe_home_x} F4000
        M400
    {% endif %}

    # ---- BDSENSOR HOMING: Z AXIS ----
    {% if home_z %}
        { action_respond_info("homing z") }
        
        # Ensure drivers are running at nominal current before moving to center
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR_X}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR_Y}
        G4 P100
        
        # Safe constraint check if Z is called completely standalone
        {% if not home_all %}
            {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
                { action_raise_error("Must home X and Y before homing Z!") }
            {% endif %}
        {% endif %}
        
        # Move toolhead to your dynamically calculated printable bed center (Y alignment)
        G90
        G0 X{safe_home_x} Y{safe_home_y} F4000 
        
        ## Homing with contactless probe with the homing_speed in [stepper_z]
        BDSENSOR_SET COLLISION_HOMING=0
        G990028 Z

        ## Homing with contact probe with the second_homing_speed in [stepper_z]
        BDSENSOR_SET COLLISION_HOMING=1
        G990028 Z
        
        # Clear bed surface cleanly for KAMP adaptive mapping
        G1 Z5 F600 
    {% endif %}

[gcode_macro HOME_Z_WITH_CLEAN]
gcode:
    # 1. Dynamically read your normal printing currents from printer.cfg
    {% set RUN_CUR_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CUR_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}

    # 2. Automatically calculate the exact bed center relative to the nozzle printable space
    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set min_x = printer.toolhead.axis_minimum.x|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    {% set min_y = printer.toolhead.axis_minimum.y|float %}

    {% set center_x = min_x + ((max_x - min_x) / 2) %}
    {% set center_y = min_y + ((max_y - min_y) / 2) %}

    {% set bd_settings = printer.configfile.settings['bdsensor']|default(none) %}
    {% set probe_offset_x = bd_settings.x_offset|default(0.0)|float if bd_settings else 0.0 %}
    {% set probe_offset_y = bd_settings.y_offset|default(0.0)|float if bd_settings else 0.0 %}

    {% set safe_home_x = center_x - probe_offset_x %}
    {% set safe_home_y = center_y - probe_offset_y %}

    # 3. Check safety conditions (Must be homed on X and Y)
    {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
        { action_raise_error("Must home X and Y before running Z Homing + Clean routine!") }
    {% else %}
        { action_respond_info("Executing specialized Z homing with cleaning cycle") }
        
        # Ensure drivers are running at nominal current before moving to center
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR_X}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR_Y}
        G4 P100
        
        # Move toolhead to your dynamically calculated printable bed center
        G90
        G0 X{safe_home_x} Y{safe_home_y} F4000 
        
        ## Homing with contactless probe with the homing_speed in [stepper_z]
        BDSENSOR_SET COLLISION_HOMING=0
        G990028 Z

        ## Clean nozzle to make sure tap is accurate
        CLEAN_NOZZLE
        
        ## Re-align to center post-cleaning in case clean macro offset toolhead position
        G90
        G0 X{safe_home_x} Y{safe_home_y} F4000 

        ## Homing with contact probe with the second_homing_speed in [stepper_z]
        BDSENSOR_SET COLLISION_HOMING=1
        G990028 Z
        
        # Clear bed surface cleanly for KAMP adaptive mapping
        G1 Z5 F600 
    {% endif %}

