# ===================================================================
# ACE helper macros - cutter, waste bucket, purge and brush wipe for toolchanges
# ===================================================================
# Copyright (c) 2026 XateEsix. Original work.
# SPDX-License-Identifier: GPL-3.0-only
# Credit: the four macro names and their arguments are the interface the ACE driver
#       (Kobra-S1/ACEPRO, our fork M1-SOC-ACE-Driver) expects from a printer config. The
#       moves are this printer's own: the cutter stroke of FILAMENT_CHANGE in print-macros.cfg
#       and the bucket and brush positions of clean-nozzle.cfg. See CREDITS.md.
# WHAT: Gives the ACE driver a way to cut the filament tip, park over the waste bucket, purge
#       there in chunks and wipe the nozzle on the rear brush during a tool change.
# WHY:  The driver calls these by name while loading and unloading. Without them T0-T3 stop
#       with an unknown-command error.
# DEPENDS: clean-nozzle.cfg (_MOVE_TO_COLLECTION_BOX), print-macros.cfg (_global_var travel
#       speed), ace-pro.cfg. X, Y and Z must be homed. The cutter and brush coordinates are
#       copies of the ones in FILAMENT_CHANGE and CLEAN_NOZZLE: change them in both places.
# STATE: Each macro was run once by the owner on 2026-10-23 and passed, in this order:
#       1. TO_THROW_POSITION with a cold nozzle.
#       2. RESUME_NOZZLE_WIPE_SEQUENCE with a cold nozzle.
#       3. CUT_TIP with a hot nozzle and no filament.
#       4. PURGE_IN_CHUNKS PURGELENGTH=10 with filament loaded and a hot nozzle.
#       Not yet run together as part of a tool change (T1-T3).
# WARNING: These move the toolhead into the rear bucket, the brush and the front-right cutter.
#       Wrong coordinates would crash it.

# WHAT: Parks the nozzle over the waste bucket at the rear, through the safe corridor.
# WHEN: The ACE driver calls it before every tool change and before every purge.
[gcode_macro TO_THROW_POSITION]
description: Move over the waste bucket (called by the ACE driver)
# Z is raised to this height first when it is lower, so the corridor move clears the frame.
variable_min_z: 5
gcode:
    {% if "xy" not in printer.toolhead.homed_axes %}
        { action_raise_error("TO_THROW_POSITION: home X and Y first") }
    {% endif %}
    {% if "z" in printer.toolhead.homed_axes and printer.toolhead.position.z|float < printer["gcode_macro TO_THROW_POSITION"].min_z|float %}
        G90
        G1 Z{printer["gcode_macro TO_THROW_POSITION"].min_z|float} F600
    {% endif %}
    _MOVE_TO_COLLECTION_BOX

# WHAT: Presses the nozzle against the front-right cutter lever so the filament is cut at the
#       nozzle. The stroke is the one of the Artillery community config (FILAMENT_CHANGE in
#       manual_change.cfg of pijalu/artillery-m1-klipper, also in print-macros.cfg here): along
#       the cutter line, a slow compression stroke, a slow slip along the blade, then a slow
#       10 mm back-off in X and the return to the corridor start.
# WHEN: The driver calls it through _ACE_PREPARE_FOR_RETRACTION, after the nozzle is hot.
# NOTE: print-macros.cfg FILAMENT_CHANGE stops after the slip and has no back-off.
[gcode_macro CUT_TIP]
description: Cut the filament tip on the cutter lever (called by the ACE driver)
variable_entry_x: 200
variable_entry_y: 260
variable_blade_x: 260
variable_blade_y: 30
variable_press_x: 262.7
variable_exit_y: -0.5
variable_backoff_x: 10
variable_stroke_speed: 600
variable_min_temp: 170
gcode:
    {% set v = printer["gcode_macro CUT_TIP"] %}
    {% if "xy" not in printer.toolhead.homed_axes %}
        { action_raise_error("CUT_TIP: home X and Y first") }
    {% endif %}
    {% if printer.extruder.temperature|float < v.min_temp|float %}
        { action_raise_error("CUT_TIP: nozzle is at %.0fC, heat it above %dC first" % (printer.extruder.temperature|float, v.min_temp|int)) }
    {% endif %}
    {% set travel = printer["gcode_macro _global_var"].pause_resume_travel_speed|float * 60 %}
    SAVE_GCODE_STATE NAME=ace_cut_tip
    G90
    M400
    G1 X{v.entry_x} Y{v.entry_y} F{travel}
    G1 X{v.blade_x} Y{v.blade_y} F{travel}
    M400
    G1 X{v.press_x} Y{v.blade_y} F{v.stroke_speed}
    M400
    G1 X{v.press_x} Y{v.exit_y} F{v.stroke_speed}
    M400
    G91
    G1 X-{v.backoff_x|float} F{v.stroke_speed}
    M400
    G90
    G1 X{v.entry_x} Y{v.entry_y} F{travel}
    M400
    RESTORE_GCODE_STATE NAME=ace_cut_tip

# WHAT: Purges over the waste bucket in chunks, with a pause after each so the strand drops,
#       then retracts a little to relieve the pressure.
# WHEN: The driver calls it from _ACE_POST_TOOLCHANGE with the purge length it calculated.
# ARGS: PURGELENGTH in mm, PURGESPEED in mm/min, PURGE_MAX_CHUNK_LENGTH in mm.
#       ALREADY_PURGED is accepted but not used: the driver passes only what is still to purge.
[gcode_macro PURGE_IN_CHUNKS]
description: Purge over the waste bucket in chunks (called by the ACE driver)
variable_pause_ms: 800
variable_retract: 2
variable_min_temp: 170
gcode:
    {% set v = printer["gcode_macro PURGE_IN_CHUNKS"] %}
    {% set purge = params.PURGELENGTH|default(50)|float %}
    {% set speed = params.PURGESPEED|default(300)|float %}
    {% set chunk = [params.PURGE_MAX_CHUNK_LENGTH|default(300)|float, 20.0]|max %}
    {% if purge > 0 %}
        {% if printer.extruder.temperature|float < v.min_temp|float %}
            { action_raise_error("PURGE_IN_CHUNKS: nozzle is at %.0fC, heat it above %dC first" % (printer.extruder.temperature|float, v.min_temp|int)) }
        {% endif %}
        { action_respond_info("Purging %.0f mm over the waste bucket in chunks of up to %.0f mm" % (purge, chunk)) }
        TO_THROW_POSITION
        M83
        {% set ns = namespace(left=purge) %}
        {% for i in range(200) %}
            {% if ns.left > 0 %}
                {% set step = [ns.left, chunk]|min %}
                G1 E{step} F{speed}
                M400
                G4 P{v.pause_ms|int}
                {% set ns.left = ns.left - step %}
            {% endif %}
        {% endfor %}
        G1 E-{v.retract|float} F1800
        M400
    {% endif %}

# WHAT: Wipes the hot nozzle across the rear silicone brush: the scrub of CLEAN_NOZZLE phase 3,
#       without its temperature changes. Works in machine Z, so a Z offset does not change the
#       brush height, as when CLEAN_NOZZLE runs after homing.
# WHEN: The driver calls it at the end of every tool change, after the purge.
[gcode_macro RESUME_NOZZLE_WIPE_SEQUENCE]
description: Wipe the nozzle on the rear brush (called by the ACE driver)
variable_x_a: 153
variable_x_b: 186
variable_y_1: 269.5
variable_y_2: 269
variable_y_3: 268.5
variable_hover_z: 5
variable_wipe_z: 0.5
variable_clear_z: 3
gcode:
    {% set v = printer["gcode_macro RESUME_NOZZLE_WIPE_SEQUENCE"] %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("RESUME_NOZZLE_WIPE_SEQUENCE: home X, Y and Z first") }
    {% endif %}
    SAVE_GCODE_STATE NAME=ace_wipe
    G90
    SET_GCODE_OFFSET Z=0 MOVE=0
    G1 X{v.x_a} Y{v.y_1} F6000
    G1 Z{v.hover_z} F3000
    G1 Z{v.wipe_z} F1500
    G1 X{v.x_b} Y{v.y_1} F3000
    G1 X{v.x_a} Y{v.y_2} F3000
    G1 X{v.x_b} Y{v.y_2} F3000
    G1 X{v.x_a} Y{v.y_3} F3000
    G1 X{v.x_b} Y{v.y_3} F3000
    M400
    G1 Z{v.clear_z} F3000
    M400
    RESTORE_GCODE_STATE NAME=ace_wipe

# ===================================================================
# ACE presence: run ACE steps only when an ACE can actually be used
# ===================================================================
# WHAT: An ACE counts as present when the driver is loaded (printer.ace exists), the
#       ACE_Pro switch is on (ace_pro_enabled) and the USB link is up (ace_connected).
#       ace_connected comes from our driver fork; an older driver lacks it, so every
#       step is skipped rather than guessed.
# WHY:  Macros that call ACE_* commands fail with "unknown command" or stall when the
#       ACE is unplugged, switched off or the driver is not loaded. Printing without
#       the ACE must keep working exactly as it did before it was added.
# HOW:  Wrap an ACE step as   ACE_RUN_IF_PRESENT CMD="ACE_ENABLE_FEED_ASSIST INDEX=1"
#       or test inline with the same condition used in ACE_RUN_IF_PRESENT.
#       Nothing here changes how T0-T3 behave: the driver already ignores them while
#       the switch is off, and an unplugged ACE never pauses a print by itself
#       (a pause needs a tool already loaded, or repeated reconnects).

# WHAT: Runs one G-code command only when an ACE is present, otherwise prints a note.
# USAGE: ACE_RUN_IF_PRESENT CMD="ACE_RETRACT INDEX=1 LENGTH=50 SPEED=30"
#        Add QUIET=1 to skip the note (for steps that run every layer).
[gcode_macro ACE_RUN_IF_PRESENT]
description: Run a G-code command only if an ACE is connected and enabled
gcode:
    {% set ace = printer["ace"] if "ace" in printer else {} %}
    {% if not params.CMD|default("") %}
        { action_raise_error("ACE_RUN_IF_PRESENT: CMD is required, e.g. CMD=\"ACE_STOP_FEED INDEX=1\"") }
    {% elif ace.ace_pro_enabled|default(false) and ace.ace_connected|default(false) %}
        {params.CMD}
    {% elif params.QUIET|default(0)|int == 0 %}
        RESPOND MSG="ACE not present, skipped: {params.CMD}"
    {% endif %}

# WHAT: Reports whether the ACE is usable and, if not, which of the three conditions fails.
[gcode_macro ACE_PRESENCE]
description: Report whether an ACE is connected and enabled
gcode:
    {% set ace = printer["ace"] if "ace" in printer else {} %}
    {% if "ace" not in printer %}
        RESPOND MSG="ACE: not present - the driver is not loaded"
    {% elif not ace.ace_pro_enabled|default(false) %}
        RESPOND MSG="ACE: not present - the ACE_Pro switch is off"
    {% elif "ace_connected" not in ace %}
        RESPOND MSG="ACE: unknown - the driver is too old to report the USB link, update it"
    {% elif not ace.ace_connected %}
        RESPOND MSG="ACE: not present - no USB link (unplugged or still connecting)"
    {% else %}
        RESPOND MSG="ACE: present and enabled"
    {% endif %}

# WHAT: One note after startup when the switch is on but the ACE is not connected.
# WHY:  So a forgotten cable is noticed before the first T0-T3, not during it.
[delayed_gcode _ACE_STARTUP_CHECK]
initial_duration: 60
gcode:
    {% if "ace" in printer and printer["ace"].ace_pro_enabled|default(false) and not printer["ace"].ace_connected|default(false) %}
        RESPOND MSG="ACE: switched on but not connected. ACE steps are skipped. Plug it in, or turn the ACE_Pro switch off to stop reconnect attempts."
    {% endif %}
