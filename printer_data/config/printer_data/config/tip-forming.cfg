# ===================================================================
# Tip forming v2 - cool, draw a thin neck, pull, then cooling moves
# ===================================================================
# Copyright (c) 2026 XateEsix. Original work.
# SPDX-License-Identifier: GPL-3.0-only
# Credit: the order of the phases (optional ram, cool-down, slow neck, fast pull, cooling
#       moves) follows the tip forming of Prusa's MMU and of Happy Hare. No code is copied.
# WHAT: Forms a tapered filament tip for unloading. The nozzle first cools to a pull
#       temperature, the filament is drawn out slowly so the neck stays thin, pulled clear
#       of the melt zone fast, then worked back and forth in the cold zone to set. The
#       nozzle target stays at the pull temperature: the caller decides about the heater.
# WHY:  _FORM_TIP in filament-macros.cfg rams 6 mm into the melt zone and pulls at full
#       print temperature. That leaves a bulge at the tip and strings, and the tip needs a
#       stiff pull to leave the extruder.
# STATE: Starting values, not tuned on this printer yet. UNLOAD_FILAMENT still calls the old
#       _FORM_TIP. Tune with TEST_FORM_TIP, then switch UNLOAD_FILAMENT over.
# DEPENDS: _FILAMENT_TYPE in filament-macros.cfg (soft-wipe temperature per material).

# Every variable can be changed for one test with TEST_FORM_TIP and stays set until Klipper
# restarts. Lengths are mm, speeds mm/s. Make a good result permanent by editing it here.
[gcode_macro _FORM_TIP_V2]
description: Forms a tapered filament tip: cool, slow neck, fast pull, cooling moves
# Pull temperature = soft-wipe temperature of the material + pull_offset. Set pull_temp
# to a fixed value to ignore the material profile. Run _FILAMENT_TYPE FILAMENT=<type> first.
variable_pull_offset: 20
variable_pull_temp: 0
# Push before cooling. A push widens the plug in the melt zone, so it starts at 0.
variable_ram_length: 0
variable_ram_speed: 3
# Slow draw out of the melt zone while the plastic is just soft enough to taper.
variable_neck_length: 6
variable_neck_speed: 2
# Fast pull clear of the heated zone.
variable_pull_length: 25
variable_pull_speed: 20
# Back-and-forth moves in the cold zone. Keep cooling_length below pull_length.
variable_cooling_moves: 3
variable_cooling_length: 8
variable_cooling_speed: 6
# Part cooling fan on while the nozzle cools (1 = on, 0 = off).
variable_fan: 1
gcode:
    {% set v = printer["gcode_macro _FORM_TIP_V2"] %}
    {% set profile_temp = printer["gcode_macro _FILAMENT_TYPE"].wipe_temp|int + v.pull_offset|int %}
    {% set pull = v.pull_temp|int if v.pull_temp|int > 0 else profile_temp %}
    {% if printer.extruder.temperature|float < pull - 15 %}
        { action_raise_error("Tip forming: nozzle is at %.0fC, heat it above %dC first" % (printer.extruder.temperature|float, pull)) }
    {% endif %}
    { action_respond_info("Tip forming: pull at %dC, ram %smm, neck %smm at %smm/s, pull %smm at %smm/s, %s cooling moves of %smm" % (pull, v.ram_length, v.neck_length, v.neck_speed, v.pull_length, v.pull_speed, v.cooling_moves, v.cooling_length)) }
    SAVE_GCODE_STATE NAME=form_tip_v2_state
    M83
    {% if v.ram_length|float > 0 %}
        G1 E{v.ram_length|float} F{v.ram_speed|float * 60}
    {% endif %}
    {% if v.fan|int > 0 %}
        M106 S255
    {% endif %}
    M104 S{pull}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={pull + 2}
    G1 E-{v.neck_length|float} F{v.neck_speed|float * 60}
    G1 E-{v.pull_length|float} F{v.pull_speed|float * 60}
    {% for i in range(v.cooling_moves|int) %}
        G1 E-{v.cooling_length|float} F{v.cooling_speed|float * 60}
        G1 E{v.cooling_length|float} F{v.cooling_speed|float * 60}
    {% endfor %}
    M400
    {% if v.fan|int > 0 %}
        M106 S0
    {% endif %}
    RESTORE_GCODE_STATE NAME=form_tip_v2_state

# WHAT: Runs the tip former once on the loaded filament and retracts it so you can pull it
#       out and look at the tip. Settings given here stay set until Klipper restarts.
# WHEN: Tuning. Heat the nozzle to the unload temperature first, or let it do that.
# TUNE: Change one setting per test. A good tip is a thin spear with no bulge and no hair.
#       Bulge: lower PULL_OFFSET or lengthen NECK_LENGTH at a lower NECK_SPEED.
#       Hair or string: raise PULL_SPEED, or lower PULL_OFFSET.
#       Tip too brittle or broken: raise PULL_OFFSET.
# EXAMPLE: TEST_FORM_TIP FILAMENT=PLA PULL_OFFSET=15 NECK_SPEED=1.5
[gcode_macro TEST_FORM_TIP]
description: Run tip forming once with optional overrides, then retract the filament to inspect it
gcode:
    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("TEST_FORM_TIP: not while printing") }
    {% endif %}
    {% for name in ['pull_offset', 'pull_temp', 'ram_length', 'ram_speed', 'neck_length', 'neck_speed', 'pull_length', 'pull_speed', 'cooling_moves', 'cooling_length', 'cooling_speed', 'fan'] %}
        {% if name|upper in params %}
            SET_GCODE_VARIABLE MACRO=_FORM_TIP_V2 VARIABLE={name} VALUE={params[name|upper]}
        {% endif %}
    {% endfor %}
    {% if 'FILAMENT' in params %}
        _FILAMENT_TYPE FILAMENT={params.FILAMENT}
    {% endif %}
    {% set heat = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% if printer.extruder.temperature|float < heat - 15 %}
        M104 S{heat}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={heat - 3}
    {% endif %}
    _FORM_TIP_V2
    G91
    G1 E-60 F900
    G90
    M104 S0
    { action_respond_info("Tip formed. Pull the filament out and look at the tip. Change one setting and run TEST_FORM_TIP again.") }
