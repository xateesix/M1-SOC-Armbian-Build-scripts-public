# SPDX-License-Identifier: GPL-3.0-only
# Credit: the [ace] option set and the ACE_Pro switch follow the reference configs of
#       Kobra-S1/ACEPRO (GPL-3.0), which builds on szkrisz/ACEPROSV08 and
#       utkabobr/DuckACE. The driver itself is our fork of it, M1-SOC-ACE-Driver. The
#       virtual_pins helper is by Pedro Lamas (GPL-3.0). See CREDITS.md.
# WHAT: Loads the ACE driver, the on/off switch it reads, persistent storage for its slot
#       inventory, and the toolhead filament sensor it needs (the existing analog sensor
#       on THR:PB1, exposed as a switch sensor).
# WHY:  The ACE resets its USB link if no command reaches it for 3 seconds, so it only
#       stays connected while this driver runs.
# STAGE: 1b = connection, status and feeding by hand (ACE_FEED, ACE_RETRACT). The helper
#       macros T0-T3 need are in ace-macros.cfg but have never run: test them one by one as
#       described there before using T0-T3. Slot 1 (T0) rejects filament, so skip it.
#       Check with ACE_GET_STATUS and ACE_GET_CONNECTION_STATUS.
#       Stage 2: hub sensor (BTT SFS V2) as filament_runout_rdm and measured tube lengths.
# DEPENDS: mcu_thr.cfg (temperature_sensor filament_adc1), print-macros.cfg (PAUSE, RESUME),
#       the M1-SOC-ACE-Driver checkout next to the Klipper tree with its extras linked
#       into klippy/extras.
# NOTE: The driver adds its own T0-T3 macros unless a [gcode_macro T0] exists. manual_change.cfg
#       and ams.cfg define those and must stay unloaded.

# The driver keeps its inventory and the enable state here, apart from variables.cfg.
[save_variables]
filename: ~/printer_data/config/saved_variables.cfg

# Provides the virtual pin behind the ACE_Pro switch.
[virtual_pins]

# Mainsail switch that turns the ACE on or off. The saved state wins after the first change.
[output_pin ACE_Pro]
pin: virtual_pin:ace_pro
pwm: False
value: 1
shutdown_value: 0

# Toolhead filament sensor for the driver, read from the analog sensor in mcu_thr.cfg.
# Loaded reads about 2.6 and empty about 28, so 15 sits in the middle, the same threshold
# as _FILAMENT_MONITOR. The driver decides what a runout means, so Klipper does not pause.
[filament_adc_sensor filament_runout_nozzle]
sensor: filament_adc1
threshold: 15.0
hysteresis: 4.0
present_when: below
debounce_count: 3
pause_on_runout: False

# Helper macros the driver calls (_ACE_STATE, _ACE_PRE_TOOLCHANGE and others), shared by
# every printer. Loaded from the driver checkout so they follow the driver version.
[include ../../M1-SOC-ACE-Driver/config/ace_macros_generic.cfg]

[ace]
ace_count: 1
baud: auto
filament_runout_sensor_name_nozzle: filament_runout_nozzle
# No hub sensor yet: leave filament_runout_sensor_name_rdm out until it is wired.

# Do not push filament by itself when the ACE connects.
feed_assist_active_after_ace_connect: False
# Only needed for OrcaSlicer filament sync, which is not set up.
moonraker_lane_sync_enabled: False
ace_connection_supervision: True
tangle_detection: True

# NOT YET TUNED. The tube lengths are rough, from the owner on 2026-10-23: ACE to hub about
# 4 ft (1220 mm), hub to toolhead about 24 in (610 mm), 1830 mm in all. A test feed of about
# 1800 mm reached the extruder. Speeds start slow.
# TODO(owner): after the first real load, note where the toolhead sensor triggered and set
# the lengths from that. The hub sensor does not exist yet, so parkposition_to_rdm_length
# is not used.
feed_speed: 30
retract_speed: 30
total_max_feeding_length: 2400
parkposition_to_toolhead_length: 1900
parkposition_to_rdm_length: 1300
toolchange_load_length: 2100
