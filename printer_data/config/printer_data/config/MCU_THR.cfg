# the chip is an stm32f103xe clone gd32f303RET6 chip with PB10 PB9 PB8 PC15 PA0 PA12 PC13 PB10 already mapped along with the standard usb pins
[mcu THR]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_10643B879894B00439333931-if00
restart_method: command

[temperature_sensor THR]
sensor_type: temperature_mcu
sensor_mcu: THR
min_temp: 0
max_temp: 100

# --- CORRECTED TWO-PIN INPUT MAPPING ---
# --- DETECTOR HARDWARE INPUTS ---
# We keep these as temperature sensors so mainline Klipper can read their raw values

[adc_temperature hall_voltage_map]
temperature1: 0
voltage1: 0.0
temperature2: 100
voltage2: 3.3
temperature3: 151
voltage3: 5.0

[temperature_sensor filament_switch]
sensor_type: hall_voltage_map
sensor_pin: THR:PB1
min_temp: -100
max_temp: 300

# --- AUTOMATED MACROS & RUNOUT LOOP ---

[gcode_macro _FILAMENT_MONITOR]
# Adjust these thresholds based on your exact observed values if needed
variable_runout_threshold: 40.0   # If ADC1 drops BELOW this value, filament is present. ABOVE means empty.
variable_enabled: True
gcode:
    {% if enabled %}
        # Fetch the current value of the filament switch
        {% set current_val = printer["temperature_sensor filament_switch"].temperature %}
        
        # If the sensor value goes HIGH (above threshold), filament has run out
        {% if current_val > runout_threshold %}
            SET_GCODE_VARIABLE MACRO=_FILAMENT_MONITOR VARIABLE=enabled VALUE=False
            M118 Filament run out! Pausing print...
            PAUSE
        {% endif %}
    {% endif %}

[delayed_gcode _RUNOUT_TICKER]
initial_duration: 1.0
gcode:
    # Run the monitor macro
    _FILAMENT_MONITOR
    # Reschedule itself to check again in 1 second
    UPDATE_DELAYED_GCODE ID=_RUNOUT_TICKER DURATION=1.0


# --- RE-ENABLE MONITORING AFTER RESUME/LOAD ---

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    # Re-enable the runout sensor when resuming print
    SET_GCODE_VARIABLE MACRO=_FILAMENT_MONITOR VARIABLE=enabled VALUE=True
    BASE_RESUME

# Passive Cutter Sensors (Monitors visually on your dashboard without interrupting prints)
[temperature_sensor cutter_sensor_adc1]
sensor_type: hall_voltage_map
sensor_pin: THR:PA1
min_temp: -100
max_temp: 300

[temperature_sensor cutter_sensor_adc2]
sensor_type: hall_voltage_map
sensor_pin: THR:PA2
min_temp: -100
max_temp: 300
