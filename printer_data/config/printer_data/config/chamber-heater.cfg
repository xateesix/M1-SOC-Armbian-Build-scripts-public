#####################################################################
#  Temperature Command Routing (Slicer Standard Overrides)
#####################################################################

[gcode_macro M141]
description: Set chamber temperature target and manage airflow profiles
gcode:
    {% set target = params.S|default(0)|float %}
    {% set mode = printer["gcode_macro _CHAMBER_VARIABLES"].required_mode|int %}
    
    {% if target > 0 %}
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={target}
        # Maximize air circulation from under the bed to heat up efficiently
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=1.0
        {% if mode == 0 %}
            SET_FAN_SPEED FAN=filter_fan SPEED=0.8
        {% endif %}
    {% else %}
        # Disabling chamber heating and primary flow
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0.0
        
        # Flush print chamber outward if manual hardware is set to exhaust mode
        {% if mode == 1 %}
            SET_FAN_SPEED FAN=filter_fan SPEED=1.0
        {% else %}
            SET_FAN_SPEED FAN=filter_fan SPEED=0.0
        {% endif %}
    {% endif %}

[gcode_macro M191]
description: Set chamber temperature and wait until minimum threshold is reached
gcode:
    {% set target = params.S|default(0)|float %}
    
    M141 S{target}
    
    {% if target > 0 %}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={target}
    {% endif %}

[gcode_macro ADJUST_PRINT_CIRCULATION]
description: Call this inside PRINT_START right before printing begins to ease airflow drafts
gcode:
    {% if printer["heater_generic chamber_heater"].target > 0 %}
        # Eases air draft velocity directly under the bed to protect the first layer
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0.4
    {% endif %}
