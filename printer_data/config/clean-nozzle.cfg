[gcode_macro CLEAN_NOZZLE]
description: Safely navigates the Y corridor to purge and wipe the nozzle, restoring original temperatures.
variable_homing_z_active: 0
gcode:
    # --- DETECT AND STORE ORIGINAL TEMPERATURES ---
    {% set original_target = printer.extruder.target|int %}
    
    # If a target was explicitly passed to the macro, use it; otherwise use the original target
    {% set target_temp = params.TARGET_TEMP|default(original_target if original_target > 140 else 220)|int %}
    {% set purge_speed = 210 | float %} 

    # --- SAFE CORRIDOR SETTINGS ---
    {% set safe_x_min = 47.5 %}
    {% set safe_x_max = 220.0 %}          
    {% set corridor_center_x = 137.0 %}   
    {% set boundary_y = 255.0 %}          
    {% set travel_speed = 6000 %}         

    SAVE_GCODE_STATE NAME=clean_nozzle_state
    G90                                   

    {% if printer.toolhead.position.y <= boundary_y %}
        {% if printer.toolhead.position.x < safe_x_min or printer.toolhead.position.x > safe_x_max %}
            G1 X{corridor_center_x} F{travel_speed}
        {% endif %}
    {% endif %}

    # --- TRANSIT & HEAT TO PURGE ---
    M109 S{target_temp}                         ; Heat up to operational cleaning temperature
    G1 X200 Y260 F{travel_speed}
    G1 X200 Y275 F{travel_speed}
    G1 X160 Y275 F{travel_speed}
    G1 X137 Y275 F3000
    M400

    # --- PURGE ---
    M83                                         
    G1 E40 F{purge_speed}                       
    G1 E-2 F{purge_speed}                       ; Retract to prevent stringing
    M400

    # --- ACTIVE SCRUB ---
    M106 S255                                   ; Part fan to maximum to crisp up the purge
    G1 X153 Y269.5 Z0.5 F3000
    G1 X186 Y269.5 Z0.5 F3000
    G1 X153 Y269 Z0.5 F3000
    G1 X186 Y269 Z0.5 F3000
    M400
    G1 Z5 F3000                                 
    M106 S0                                     ; Turn off fan

    # --- SAFE EXIT ---
    G1 X{corridor_center_x} Y269 F{travel_speed}
    G1 Y{boundary_y} F{travel_speed}

    # --- RESTORE PREVIOUS TEMPERATURE ---
    {% if original_target > 0 %}
        M104 S{original_target}                 ; Set the heater back to whatever the printer was doing before
    {% endif %}

    RESTORE_GCODE_STATE NAME=clean_nozzle_state
