[mcu TinyFan]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044506118D8901C-if00
restart_method: command

[temperature_sensor TinyFan]
sensor_type: temperature_mcu
sensor_mcu: TinyFan
min_temp: 0
max_temp: 125

[board_pins tinyfan]
mcu: TinyFan
aliases:
    #FAN Ports:
    FAN1_PWM=gpio0, FAN1_RPM=gpio7,
    FAN2_PWM=gpio1, FAN2_RPM=gpio8,
    FAN3_PWM=gpio2, FAN3_RPM=gpio9,
    FAN4_PWM=gpio3, FAN4_RPM=gpio10,

    #AUX Ports:
    AUX1_PWM=gpio4, AUX1_RPM=gpio26,
    AUX2_PWM=gpio5, AUX2_RPM=gpio27,
    AUX3_PWM=gpio6, AUX3_RPM=gpio28,

    #GPIO Header:
    G1=gpio29, G2=gpio11, G3=gpio12,
    G4=gpio13, G5=gpio14, G6=gpio15,

    #Waveshare LED:
    LED=gpio16

[neopixel TinyFan]
pin: TinyFan:LED
initial_RED: 0
initial_GREEN: 1
initial_BLUE: 0

# Auxiliary fan
[fan_generic chamber_circulation_fan]
pin: TinyFan:FAN1_PWM
#pin: TinyFan:AUX3_PWM
tachometer_pin: ^TinyFan:FAN1_RPM
#tachometer_ppr:2
enable_pin: TinyFan:AUX3_PWM
off_below: 0.15
shutdown_speed:0
#fan_speed: 1.0
#idle_speed: 0.6
cycle_time: 0.001
#hardware_pwm: true
#heater: chamber        # Matches the exact name of your [heater_generic]

# Auxiliary fan
[heater_fan chamber_heater_fan]
pin: TinyFan:FAN2_PWM
#pin: TinyFan:AUX3_PWM
tachometer_pin: ^TinyFan:FAN2_RPM
#tachometer_ppr:2
enable_pin: TinyFan:AUX2_PWM
off_below: 0.15
shutdown_speed:0
#fan_speed: 1.0
#idle_speed: 0.6
cycle_time: 0.001
#hardware_pwm: true
heater: chamber_heater       # Matches the exact name of your [heater_generic]
heater_temp: 40.0             # Turns fan ON above 40°C, and OFF once it cools back below 40°C

# TinyFan placeholder pin map for two PWM fans with tach inputs.
