# Rockchip RK3308B-S EVB M1SOC board configuration for Armbian (Artillery M1 Pro)
# Compatible: rockchip,rk3308bs-evb-m1soc
#
# Hardware summary:
#   SoC    : Rockchip RK3308BS (quad-core ARM Cortex-A35, AArch64, max 1104 MHz)
#   RAM    : 512 MB DDR3
#   Storage: eMMC (8-bit HS200) + microSD slot
#   WiFi   : RTL8189CS via SDIO (GPIO0_A2 reset, GPIO0_A0 wake)
#   BT     : via UART0 with HW flow control
#   USB    : USB-C OTG (dwc2) + 2x USB-A 5V host (EHCI/OHCI)
#   Display: 4.3" 480x272 RGB panel + Goodix GT911 touch (I2C3)
#   Audio  : Internal RK3308 ACODEC (analog MIC + HP + speaker)
#   Console: UART3 @ 1500000 baud (ttyS3)
#   LEDs   : GPIO0_A6 (power/green), GPIO0_A5 (heartbeat/blue)
#   Power  : 24V input via USB connector  ->  onboard buck converter

BOARD_NAME="RK3308BS EVB M1SOC (Artillery M1 Pro)"
BOARDFAMILY="rockchip64"
BOARD_MAINTAINER=""

# U-Boot defconfig  -  evb-rk3308_defconfig is the upstream EVB config.
# Fallback: change to rock-pi-s-rk3308_defconfig if the EVB config is
# not available in your Armbian U-Boot source tree.
BOOTCONFIG="evb-rk3308_defconfig"

# Only "current" is tested; add "edge" once display/audio drivers mature.
KERNEL_TARGET="current"
KERNEL_TEST_TARGET="current"

# Headless image (the display is driven by the DRM/VOP driver, not a desktop DE)
FULL_DESKTOP="no"
BOOT_LOGO="desktop"

# GPT partition table  -  required for eMMC boot on Rockchip64
IMAGE_PARTITION_TABLE="gpt"

# Serial console  -  UART3 (ttyS3) at 1500000 baud
# Factory OEM images often use fiq-debugger / display-only logging with no
# standard tty login; Armbian must set cmdline + getty explicitly (see pack script).
SERIALCON="ttyS3"

# Passed into Armbian boot scripts / kernel cmdline generation (SD-boot path)
IMAGE_CMDLINE="console=ttyS3,1500000n8 earlycon=uart8250,mmio32,0xff0d0000 loglevel=7"

# DTB file to load  -  compiled natively by Armbian's kernel build (patches/0001
# adds the DTS AND registers it in the kernel's DTS Makefile as of 2026-09-02)
BOOT_FDT_FILE="rockchip/rk3308bs-evb-m1soc.dtb"
