name: Sync Printer Backup to Main

on:
  push:
    branches:
      - printer-backup

permissions:
  contents: write

jobs:
  merge-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"

      - name: Merge printer-backup into main
        run: |
          git checkout main
          git merge origin/printer-backup --no-edit -X theirs -m "Automated sync: Updated printer configuration files"
          git push origin main
